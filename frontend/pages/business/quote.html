<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>window.PAGE_BASE='../../';</script>
    <title>报价管理 - 文的项目工作台</title>
    <script src="../../assets/tailwind.min.js"></script>
    <!-- Phosphor Icons（本地引入） -->
    <link rel="stylesheet" href="../../assets/fonts/phosphor-regular.css">
    <link rel="stylesheet" href="../../assets/fonts/phosphor-fill.css">
    <link rel="stylesheet" href="../../assets/fonts/inter.css">
<script src="../../js/tailwind-config.js"></script>
    <script src="../../js/cdn-fallback.js"></script>
    <link rel="stylesheet" href="../../css/common.css">
    <style type="text/tailwindcss">
        /* 页面专属：表单样式 */
        .form-input {
            @apply w-full border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none bg-white focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition-all text-gray-800 placeholder-gray-400;
        }
        .form-label {
            @apply block text-xs font-medium text-gray-500 mb-1.5;
        }

        /* 页面专属：报价单预览 */
        .paper-preview {
            @apply bg-white rounded-lg shadow-paper border border-gray-200 p-8 mx-auto relative;
            width: 100%;
            max-width: 500px;
            min-height: 700px;
        }
        .paper-dash-line {
            @apply border-b border-dashed border-gray-300 my-4;
        }
    </style>
    <script src="../../js/sidebar.js"></script>
<script src="../../js/header.js"></script>
    <script src="../../js/spa-router.js"></script>
<script src="../../js/avatar.js"></script>
<script src="../../js/platform-icons.js"></script>
<script src="../../js/order-form.js"></script>
<!-- html2canvas：本地引入，用于导出 PNG -->
<script src="../../assets/html2canvas.min.js"></script>
</head>
<body class="flex h-screen overflow-hidden text-sm">

    <!-- Sidebar (Reused from previous designs) -->
    

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full overflow-hidden bg-[#f9fafb]">
    <div id="page-view" class="flex-1 flex flex-col overflow-hidden"><!-- Editor & Preview Area -->
        <div class="flex-1 overflow-y-auto p-6 lg:p-8">
            <div class="max-w-[1400px] mx-auto flex flex-col lg:flex-row gap-6 items-start">
                
                <!-- LEFT COLUMN: Editor Form -->
                <div class="w-full lg:w-[55%] flex flex-col gap-5">
                    
                    <!-- Basic Info Section -->
                    <div class="card">
                        <div class="flex items-center gap-2 mb-4 border-b border-gray-50 pb-3">
                            <i class="ph-fill ph-info text-brand-500 text-lg"></i>
                            <h3 class="font-semibold text-gray-800 text-base">基础信息</h3>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="form-label">项目名称</label>
                                <input type="text" data-field="projectName" value="企业官网定制开发 (双端自适应)" class="form-input">
                            </div>
                            <div>
                                <label class="form-label">客户名称</label>
                                <input type="text" data-field="customerName" value="张先生" class="form-input">
                            </div>
                            <div>
                                <label class="form-label">报价日期</label>
                                <input type="date" data-field="quoteDate" value="2025-07-03" class="form-input">
                            </div>
                            <div>
                                <label class="form-label">预计周期 (天)</label>
                                <input type="number" data-field="cycle" value="15" class="form-input">
                            </div>
                        </div>
                    </div>

                    <!-- Quoation Items Section -->
                    <div class="card">
                        <div class="flex items-center justify-between mb-4 border-b border-gray-50 pb-3">
                            <div class="flex items-center gap-2">
                                <i class="ph-fill ph-list-numbers text-orange-500 text-lg"></i>
                                <h3 class="font-semibold text-gray-800 text-base">报价明细</h3>
                            </div>
                            <button class="text-brand-600 hover:text-brand-700 text-sm font-medium flex items-center gap-1">
                                <i class="ph ph-squares-four"></i> 从模板导入
                            </button>
                        </div>
                        
                        <!-- List of items (Dynamic) -->
                        <div id="quote-items-container" class="space-y-4">
                            <!-- Items rendered by JS -->
                        </div>

                        <!-- Add Button -->
                        <button id="add-item-btn" class="w-full mt-4 py-2.5 border border-dashed border-brand-300 text-brand-600 bg-brand-50/50 rounded-lg hover:bg-brand-50 transition-colors text-sm flex items-center justify-center gap-2">
                            <i class="ph ph-plus-circle text-lg"></i> 添加明细行
                        </button>
                    </div>

                    <!-- Additional Terms -->
                    <div class="card">
                        <div class="flex items-center gap-2 mb-4 border-b border-gray-50 pb-3">
                            <i class="ph-fill ph-file-text text-purple-500 text-lg"></i>
                            <h3 class="font-semibold text-gray-800 text-base">附加条款与备注</h3>
                        </div>
                        <div class="grid grid-cols-2 gap-4 mb-4">
                            <div>
                                <label class="form-label">优惠折扣 (减免 ¥)</label>
                                <input type="number" data-field="discount" value="300" class="form-input text-red-500 font-medium">
                            </div>
                            <div>
                                <label class="form-label">付款方式 (默认推荐 5-4-1)</label>
                                <select data-field="paymentMethod" class="form-input">
                                    <option value="50%预付定金启动项目，40%测试上线无误后支付，10%为尾款交付源码时支付。">50%预付，40%上线，10%尾款</option>
                                    <option value="40%预付定金启动项目，60%上线交付无误后一次性支付。">40%预付，60%上线交付</option>
                                    <option value="全额预付（九折优惠），项目完成后交付全部源码。">全额预付 (九折优惠)</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label class="form-label">补充说明 (将显示在报价单底部)</label>
                            <textarea data-field="notes" rows="3" class="form-input resize-none">1. 本报价有效期为 7 天。
2. 免费提供首年服务器日常维护及程序Bug修复。
3. 超出上述需求范围的新增功能，需另行评估报价。</textarea>
                        </div>
                    </div>
                </div>

                <!-- RIGHT COLUMN: Sticky Preview -->
                <div class="w-full lg:w-[45%] lg:sticky lg:top-8 flex flex-col gap-4">
                    
                    <!-- Action Bar -->
                    <div class="flex items-center gap-3 bg-white p-3 rounded-xl shadow-soft border border-gray-100">
                        <button onclick="copyQuote()" class="flex-1 bg-gray-900 hover:bg-gray-800 text-white py-2.5 rounded-lg font-medium flex items-center justify-center gap-2 transition-colors">
                            <i class="ph ph-copy text-lg"></i> 复制为文本
                        </button>
                        <button onclick="exportPDF()" class="flex-1 bg-brand-600 hover:bg-brand-700 text-white py-2.5 rounded-lg font-medium flex items-center justify-center gap-2 transition-colors shadow-sm shadow-brand-500/30">
                            <i class="ph ph-file-pdf text-lg"></i> 导出 PDF
                        </button>
                        <button onclick="exportPNG()" class="flex-1 bg-green-600 hover:bg-green-700 text-white py-2.5 rounded-lg font-medium flex items-center justify-center gap-2 transition-colors shadow-sm shadow-green-500/30">
                            <i class="ph ph-file-image text-lg"></i> 导出 PNG
                        </button>
                        <button class="w-11 h-11 border border-gray-200 text-gray-600 bg-gray-50 rounded-lg hover:bg-gray-100 flex items-center justify-center transition-colors tooltip" title="预览设置">
                            <i class="ph ph-sliders text-lg"></i>
                        </button>
                    </div>

                    <!-- Actual A4 Preview -->
                    <div class="paper-preview overflow-hidden" id="quote-preview-content">
                        <!-- Watermark/Brand element -->
                        <div class="absolute top-0 right-0 w-32 h-32 bg-brand-50 rounded-bl-full -z-10 opacity-50"></div>
                        
                        <!-- Header -->
                        <div class="flex justify-between items-end mb-6">
                            <div>
                                <h2 class="text-2xl font-bold text-gray-900 tracking-wide mb-1">开发报价单</h2>
                                <p class="text-xs text-gray-400 font-mono">NO: QUO-20250703-001</p>
                            </div>
                            <div class="text-right">
                                <div class="w-8 h-8 bg-brand-600 rounded flex items-center justify-center text-white ml-auto mb-1">
                                    <i class="ph-fill ph-bag text-sm"></i>
                                </div>
                                <p class="text-xs font-semibold text-gray-800">JERN工作室</p>
                            </div>
                        </div>

                        <!-- Meta Info -->
                        <div class="bg-gray-50/80 rounded-md p-4 mb-6 grid grid-cols-2 gap-y-2 text-sm border border-gray-100/50">
                            <div class="flex">
                                <span class="text-gray-500 w-16">项目名称：</span>
                                <span class="text-gray-800 font-medium truncate" id="pv-projectName">企业官网定制开发 (双端)</span>
                            </div>
                            <div class="flex">
                                <span class="text-gray-500 w-16">报价日期：</span>
                                <span class="text-gray-800" id="pv-quoteDate">2025-07-03</span>
                            </div>
                            <div class="flex">
                                <span class="text-gray-500 w-16">客户名称：</span>
                                <span class="text-gray-800" id="pv-customerName">张先生</span>
                            </div>
                            <div class="flex">
                                <span class="text-gray-500 w-16">预计周期：</span>
                                <span class="text-gray-800" id="pv-cycle">15 工作日</span>
                            </div>
                        </div>

                        <!-- Table Headers -->
                        <div class="grid grid-cols-12 gap-2 text-xs font-medium text-gray-500 mb-2 px-2">
                            <div class="col-span-7">服务明细 (内容描述)</div>
                            <div class="col-span-2 text-center">数量</div>
                            <div class="col-span-3 text-right">金额 (¥)</div>
                        </div>
                        <div class="h-px bg-gray-800 mb-3"></div>

                        <!-- Items (Dynamic) -->
                        <div class="space-y-4 text-sm px-2 min-h-[200px]" id="pv-items">
                            <!-- Preview items rendered by JS -->
                        </div>

                        <div class="paper-dash-line"></div>

                        <!-- Totals -->
                        <div class="w-full flex justify-end mb-8">
                            <div class="w-1/2 space-y-2">
                                <div class="flex justify-between text-sm text-gray-600">
                                    <span>小计：</span>
                                    <span id="pv-subtotal">¥ 6,300.00</span>
                                </div>
                                <div class="flex justify-between text-sm text-red-500">
                                    <span>优惠折扣：</span>
                                    <span id="pv-discount">- ¥ 300.00</span>
                                </div>
                                <div class="h-px bg-gray-200 my-1"></div>
                                <div class="flex justify-between items-end">
                                    <span class="font-medium text-gray-800">总计金额：</span>
                                    <span class="text-xl font-bold text-gray-900 font-mono" id="pv-total">¥ 6,000.00</span>
                                </div>
                            </div>
                        </div>

                        <!-- Footer notes -->
                        <div class="bg-blue-50/50 rounded p-4 border border-blue-100/50">
                            <h4 class="text-xs font-semibold text-gray-800 mb-2 flex items-center gap-1">
                                <i class="ph-fill ph-warning-circle text-blue-500"></i> 补充说明及付款方式
                            </h4>
                            <div class="text-[11px] text-gray-600 leading-relaxed space-y-1" id="pv-notes">
                                <!-- Notes rendered by JS -->
                            </div>
                        </div>
                        
                        <div class="text-center mt-8 text-[10px] text-gray-400">
                            生成自 文的项目工作台 - 科技赋能自由开发
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</main>

    <!-- Toast Notification (Hidden by default) -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-lg shadow-lg flex items-center gap-2 transform translate-y-10 opacity-0 transition-all duration-300 pointer-events-none z-50">
        <i class="ph-fill ph-check-circle text-green-400"></i>
        <span>报价文本已复制到剪贴板！</span>
    </div>

    <script>
        // ========== 报价数据模型 ==========
        var quoteData = {
            projectName: '企业官网定制开发 (双端自适应)',
            customerName: '张先生',
            quoteDate: '2025-07-03',
            cycle: '15',
            discount: '300',
            paymentMethod: '50%预付定金启动项目，40%测试上线无误后支付，10%为尾款交付源码时支付。',
            notes: '1. 本报价有效期为 7 天。\n2. 免费提供首年服务器日常维护及程序Bug修复。\n3. 超出上述需求范围的新增功能，需另行评估报价。',
            items: [
                { name: '基础架构与UI/UX设计', qty: 1, price: 2000, desc: '包含首页、关于我们、产品展示等5个核心页面的设计与前端重构 (响应式)' },
                { name: '后端管理系统开发', qty: 1, price: 3500, desc: '总览看板(CMS)、产品管理、基础权限分配、API接口开发' },
                { name: '服务器部署与备案协助', qty: 1, price: 800, desc: 'Linux环境配置、SSL证书配置、域名解析及上线测试' }
            ]
        };

        // ========== 工具函数 ==========
        function formatMoney(n) {
            return parseFloat(n || 0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function calcSubtotal() {
            return quoteData.items.reduce(function (sum, item) {
                return sum + (item.qty * item.price);
            }, 0);
        }

        function calcTotal() {
            return calcSubtotal() - parseFloat(quoteData.discount || 0);
        }

        // ========== 渲染表单明细行 ==========
        function renderFormItems() {
            var container = document.getElementById('quote-items-container');
            container.innerHTML = quoteData.items.map(function (item, index) {
                return [
                    '<div class="bg-gray-50/50 p-4 rounded-lg border border-gray-100 relative group">',
                    '  <button onclick="removeItem(' + index + ')" class="absolute -right-2 -top-2 w-6 h-6 bg-white border border-gray-200 text-gray-400 hover:text-red-500 rounded-full flex items-center justify-center shadow-sm opacity-0 group-hover:opacity-100 transition-opacity"><i class="ph ph-x text-xs"></i></button>',
                    '  <div class="grid grid-cols-12 gap-3 mb-2">',
                    '    <div class="col-span-7">',
                    '      <label class="form-label">模块名称</label>',
                    '      <input type="text" value="' + (item.name || '') + '" data-item="' + index + '" data-key="name" class="form-input bg-white" placeholder="模块名称...">',
                    '    </div>',
                    '    <div class="col-span-2">',
                    '      <label class="form-label">数量</label>',
                    '      <input type="number" value="' + item.qty + '" data-item="' + index + '" data-key="qty" class="form-input bg-white text-center">',
                    '    </div>',
                    '    <div class="col-span-3">',
                    '      <label class="form-label">单价 (¥)</label>',
                    '      <input type="number" value="' + item.price + '" data-item="' + index + '" data-key="price" class="form-input bg-white text-right">',
                    '    </div>',
                    '  </div>',
                    '  <div>',
                    '    <input type="text" value="' + (item.desc || '') + '" data-item="' + index + '" data-key="desc" class="form-input bg-white text-xs text-gray-500" placeholder="模块功能简述...">',
                    '  </div>',
                    '</div>'
                ].join('');
            }).join('');
        }

        // ========== 渲染预览 ==========
        function renderPreview() {
            // 基础信息
            document.getElementById('pv-projectName').textContent = quoteData.projectName || '—';
            document.getElementById('pv-customerName').textContent = quoteData.customerName || '—';
            document.getElementById('pv-quoteDate').textContent = quoteData.quoteDate || '—';
            document.getElementById('pv-cycle').textContent = (quoteData.cycle || '0') + ' 工作日';

            // 明细列表
            var itemsHtml = quoteData.items.map(function (item, i) {
                var amount = item.qty * item.price;
                return [
                    '<div class="grid grid-cols-12 gap-2 items-start">',
                    '  <div class="col-span-7">',
                    '    <p class="font-semibold text-gray-800">' + (i + 1) + '. ' + (item.name || '未命名模块') + '</p>',
                    item.desc ? '<p class="text-xs text-gray-500 mt-1 leading-relaxed">' + item.desc + '</p>' : '',
                    '  </div>',
                    '  <div class="col-span-2 text-center text-gray-600 mt-0.5">' + item.qty + '</div>',
                    '  <div class="col-span-3 text-right font-medium text-gray-800 mt-0.5">' + formatMoney(amount) + '</div>',
                    '</div>'
                ].join('');
            }).join('');
            document.getElementById('pv-items').innerHTML = itemsHtml || '<p class="text-center text-gray-300 py-8">暂无报价明细</p>';

            // 金额合计
            var subtotal = calcSubtotal();
            var discount = parseFloat(quoteData.discount || 0);
            var total = subtotal - discount;

            document.getElementById('pv-subtotal').textContent = '¥ ' + formatMoney(subtotal);
            document.getElementById('pv-discount').textContent = '- ¥ ' + formatMoney(discount);
            document.getElementById('pv-total').textContent = '¥ ' + formatMoney(total);

            // 补充说明
            var notesHtml = '';
            notesHtml += '<p><strong>付款方式：</strong> ' + (quoteData.paymentMethod || '') + '</p>';
            if (quoteData.notes) {
                quoteData.notes.split('\n').forEach(function (line) {
                    if (line.trim()) notesHtml += '<p>' + line.trim() + '</p>';
                });
            }
            document.getElementById('pv-notes').innerHTML = notesHtml;
        }

        // ========== 全量刷新 ==========
        function renderAll() {
            renderFormItems();
            renderPreview();
            bindItemEvents();
        }

        // ========== 事件绑定 ==========
        function bindFieldEvents() {
            document.querySelectorAll('[data-field]').forEach(function (input) {
                var field = input.getAttribute('data-field');
                input.value = quoteData[field] !== undefined ? quoteData[field] : '';
                input.addEventListener('input', function () {
                    quoteData[field] = input.value;
                    renderPreview();
                });
            });
        }

        function bindItemEvents() {
            document.querySelectorAll('[data-item]').forEach(function (input) {
                var index = parseInt(input.getAttribute('data-item'));
                var key = input.getAttribute('data-key');
                input.addEventListener('input', function () {
                    if (key === 'qty' || key === 'price') {
                        quoteData.items[index][key] = parseFloat(input.value) || 0;
                    } else {
                        quoteData.items[index][key] = input.value;
                    }
                    renderPreview();
                });
            });
        }

        // ========== 添加 / 删除明细 ==========
        function addItem() {
            quoteData.items.push({ name: '', qty: 1, price: 0, desc: '' });
            renderAll();
        }

        function removeItem(index) {
            quoteData.items.splice(index, 1);
            renderAll();
        }

        // ========== 复制报价文本 ==========
        function copyQuote() {
            var lines = [];
            lines.push('【项目报价单：' + quoteData.projectName + '】');
            lines.push('客户：' + quoteData.customerName + ' | 周期：' + quoteData.cycle + '天 | 日期：' + quoteData.quoteDate);
            lines.push('----------------------------------------');
            quoteData.items.forEach(function (item, i) {
                lines.push((i + 1) + '. ' + item.name);
                if (item.desc) lines.push('   (' + item.desc + ')');
                lines.push('   ¥' + formatMoney(item.qty * item.price));
            });
            lines.push('----------------------------------------');
            lines.push('小计：¥' + formatMoney(calcSubtotal()));
            lines.push('优惠折扣：-¥' + formatMoney(parseFloat(quoteData.discount || 0)));
            lines.push('【总计金额：¥' + formatMoney(calcTotal()) + '】');
            lines.push('');
            lines.push('付款方式：' + quoteData.paymentMethod);
            if (quoteData.notes) lines.push('补充说明：' + quoteData.notes.replace(/\n/g, '；'));

            navigator.clipboard.writeText(lines.join('\n')).then(function () {
                showToast();
            }).catch(function (err) {
                console.error('Copy failed', err);
            });
        }

        function showToast() {
            var toast = document.getElementById('toast');
            toast.classList.remove('translate-y-10', 'opacity-0');
            setTimeout(function () {
                toast.classList.add('translate-y-10', 'opacity-0');
            }, 3000);
        }

        // ========== 初始化 ==========
        document.addEventListener('DOMContentLoaded', function () {
            renderAll();
            bindFieldEvents();
            document.getElementById('add-item-btn').addEventListener('click', addItem);
        });

        // SPA 切换后重新初始化
        window.addEventListener('spa:ready', function () {
            renderAll();
            bindFieldEvents();
            var addBtn = document.getElementById('add-item-btn');
            if (addBtn) addBtn.addEventListener('click', addItem);
        });
    </script>
</body>
</html>
