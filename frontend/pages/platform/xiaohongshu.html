<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>window.PAGE_BASE='../../';</script>
<title>小红书 - 平台管理 - 文的项目工作台</title>
<script src="../../assets/tailwind.min.js"></script>
<link rel="stylesheet" href="../../assets/fonts/phosphor-regular.css">
<link rel="stylesheet" href="../../assets/fonts/phosphor-fill.css">
<link rel="stylesheet" href="../../assets/fonts/inter.css">
<script src="../../js/tailwind-config.js"></script>
<script src="../../js/cdn-fallback.js"></script>
<link rel="stylesheet" href="../../css/common.css">
<script src="../../js/theme.js"></script>
<script src="../../js/sidebar.js"></script>
<script src="../../js/header.js"></script>
<script src="../../js/spa-router.js"></script>
<script src="../../js/avatar.js"></script>
<script src="../../js/platform-icons.js"></script>
<script src="../../js/platform-manager.js"></script>
</head>
<body class="flex h-screen overflow-hidden text-sm bg-gray-50 text-gray-700">

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full overflow-hidden bg-[#f9fafb]">
    <div id="page-view" class="flex-1 flex flex-col overflow-hidden">
        <div class="flex-1 overflow-y-auto p-6 lg:p-8">
            <div class="max-w-[1400px] mx-auto">

                <!-- Page Header -->
                <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-red-500 flex items-center justify-center text-white font-bold text-xs">小红书</div>
                        <div>
                            <h2 class="text-2xl font-bold text-gray-800">小红书管理</h2>
                            <p class="text-sm text-gray-500">管理小红书发布内容，追踪互动与转化</p>
                        </div>
                    </div>
                    <button id="pm-new-btn" class="bg-brand-600 hover:bg-brand-700 text-white px-5 py-2.5 rounded-lg text-sm font-medium flex items-center gap-2 transition-colors shadow-sm">
                        <i class="ph ph-plus"></i> 新建发布
                    </button>
                </div>

                <!-- Stats Cards -->
                <div id="pm-stats" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                    <!-- 由 platform-manager.js 渲染 -->
                </div>

                <!-- Filters & Tabs -->
                <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
                    <div id="pm-tabs" class="flex bg-gray-100/80 p-1 rounded-lg">
                        <!-- 由 platform-manager.js 渲染 -->
                    </div>
                    <div id="pm-categories" class="flex items-center gap-2">
                        <span class="text-sm text-gray-500 mr-1">内容分类:</span>
                        <!-- 由 platform-manager.js 渲染 -->
                    </div>
                </div>

                <!-- Posts Grid -->
                <div id="pm-posts" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                    <!-- 由 platform-manager.js 渲染 -->
                </div>

            </div>
        </div>
    </div>
</main>

<script>
function initXiaohongshuPage() {
    if (!window.PlatformManager) return;
    PlatformManager.init({
        platform: 'xiaohongshu',
        label: '小红书',
        color: 'red',
        accentClass: 'bg-red-500 text-white',
        accentLight: 'bg-red-50 text-red-600 border-red-300',
        accentText: 'text-red-500',
        categories: ['干货分享', '案例展示', '引流文案', '客户反馈', '其他'],
        aspectRatio: 'aspect-[3/4]',
        isVideo: false
    });
}
document.addEventListener('DOMContentLoaded', initXiaohongshuPage);
window.addEventListener('spa:ready', function(e) {
    var page = (e && e.detail && e.detail.page) || '';
    if (page && page.indexOf('xiaohongshu') === -1) return;
    initXiaohongshuPage();
});
</script>

</body>
</html>
