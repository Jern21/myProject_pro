<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>window.PAGE_BASE='../../';</script>
    <title>网址收藏 - 文的项目工作台</title>
    <script src="../../assets/tailwind.min.js"></script>
    <!-- Phosphor Icons（本地引入） -->
    <link rel="stylesheet" href="../../assets/fonts/phosphor-regular.css">
    <link rel="stylesheet" href="../../assets/fonts/phosphor-fill.css">
    <link rel="stylesheet" href="../../assets/fonts/inter.css">
    <script src="../../js/tailwind-config.js"></script>
    <script src="../../js/cdn-fallback.js"></script>
    <link rel="stylesheet" href="../../css/common.css">
    <script src="../../js/theme.js"></script>
    <!-- 统一 API 封装层 -->
    <script src="../../js/api.js"></script>
    <!-- 全局 UI 组件 -->
    <script src="../../js/ui-components.js"></script>
    <!-- 页面滚动位置记忆 -->
    <script src="../../js/scroll-memory.js"></script>
    <script src="../../js/sidebar.js"></script>
    <script src="../../js/header.js"></script>
    <script src="../../js/spa-router.js"></script>
    <script src="../../js/avatar.js"></script>
    <script src="../../js/platform-icons.js"></script>
    <style type="text/tailwindcss">
        .bookmark-card {
            @apply bg-white rounded-xl border border-gray-100 p-4 hover:shadow-md transition-all cursor-pointer;
        }
        .category-badge {
            @apply px-2 py-0.5 rounded-full text-xs font-medium;
        }
        .category-docs { @apply bg-blue-50 text-blue-600; }
        .category-tools { @apply bg-green-50 text-green-600; }
        .category-learning { @apply bg-purple-50 text-purple-600; }
        .category-design { @apply bg-pink-50 text-pink-600; }
        .category-community { @apply bg-orange-50 text-orange-600; }
        .category-other { @apply bg-gray-50 text-gray-600; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-sm">

    <!-- Sidebar -->

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full overflow-hidden bg-[#f9fafb]">
    <div id="page-view" class="flex-1 flex flex-col overflow-hidden">
        <!-- Content Area -->
        <div class="flex-1 overflow-y-auto p-6 lg:p-8">
            <div class="max-w-[1200px] mx-auto">

                <!-- Filter & Search Bar -->
                <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center gap-3">
                        <select id="filter-category" class="border border-gray-200 rounded-lg px-3 py-2 text-sm bg-white outline-none focus:border-brand-500">
                            <option value="">全部分类</option>
                            <option value="docs">技术文档</option>
                            <option value="tools">开发工具</option>
                            <option value="learning">学习资源</option>
                            <option value="design">设计资源</option>
                            <option value="community">技术社区</option>
                            <option value="other">其他</option>
                        </select>
                        <div class="relative">
                            <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                            <input type="text" id="search-input" placeholder="搜索网站名称、标签..." class="pl-9 pr-4 py-2 border border-gray-200 rounded-lg text-sm w-64 outline-none focus:border-brand-500">
                        </div>
                    </div>
                    <button onclick="openBookmarkForm()" class="px-4 py-2 bg-brand-500 text-white rounded-lg hover:bg-brand-600 transition-colors flex items-center gap-2">
                        <i class="ph ph-plus"></i> 添加收藏
                    </button>
                </div>

                <!-- Bookmarks Grid -->
                <div id="bookmarks-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                    <!-- 动态渲染 -->
                </div>

                <!-- Empty State -->
                <div id="empty-state" class="hidden flex flex-col items-center justify-center py-20">
                    <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mb-4">
                        <i class="ph ph-bookmark-simple text-3xl text-gray-400"></i>
                    </div>
                    <p class="text-gray-500 mb-2">暂无收藏网址</p>
                    <p class="text-gray-400 text-xs">点击右上角添加第一个收藏</p>
                </div>

            </div>
        </div>
    <!-- Bookmark Form Drawer -->
    <div id="bookmark-drawer" class="fixed inset-0 z-[1000] hidden">
        <div class="absolute inset-0 bg-black/30 backdrop-blur-sm" onclick="closeBookmarkForm()"></div>
        <div class="absolute right-0 top-0 h-full w-[480px] bg-white shadow-2xl transform translate-x-full transition-transform duration-300" id="bookmark-drawer-panel">
            <div class="flex flex-col h-full">
                <!-- Header -->
                <div class="flex items-center justify-between p-6 border-b border-gray-100">
                    <h3 class="text-lg font-bold text-gray-800" id="drawer-title">添加收藏</h3>
                    <button onclick="closeBookmarkForm()" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-gray-100 transition-colors">
                        <i class="ph ph-x text-gray-500"></i>
                    </button>
                </div>

                <!-- Form Body -->
                <div class="flex-1 overflow-y-auto p-6">
                    <form id="bookmark-form" class="space-y-5">
                        <input type="hidden" id="bookmark-id">

                        <!-- 网站名称 -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">网站名称 <span class="text-red-500">*</span></label>
                            <input type="text" id="bookmark-title" class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-brand-500" placeholder="例如：Vue.js 官方文档" required>
                        </div>

                        <!-- 网址链接 -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">网址 <span class="text-red-500">*</span></label>
                            <input type="url" id="bookmark-url" class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-brand-500" placeholder="https://..." required>
                        </div>

                        <!-- 分类 -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">分类 <span class="text-red-500">*</span></label>
                            <select id="bookmark-category" class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-brand-500 bg-white" required>
                                <option value="">选择分类</option>
                                <option value="docs">技术文档</option>
                                <option value="tools">开发工具</option>
                                <option value="learning">学习资源</option>
                                <option value="design">设计资源</option>
                                <option value="community">技术社区</option>
                                <option value="other">其他</option>
                            </select>
                        </div>

                        <!-- 标签 -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">标签</label>
                            <input type="text" id="bookmark-tags" class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-brand-500" placeholder="用逗号分隔，例如：前端, Vue, 教程">
                            <p class="text-xs text-gray-400 mt-1">多个标签用逗号分隔</p>
                        </div>

                        <!-- 描述 -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">描述</label>
                            <textarea id="bookmark-desc" rows="3" class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-brand-500 resize-none" placeholder="添加网站描述..."></textarea>
                        </div>
                    </form>
                </div>

                <!-- Footer -->
                <div class="p-6 border-t border-gray-100 flex gap-3">
                    <button type="button" onclick="closeBookmarkForm()" class="flex-1 px-4 py-2.5 border border-gray-200 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors">取消</button>
                    <button type="button" onclick="saveBookmark()" class="flex-1 px-4 py-2.5 bg-brand-500 text-white rounded-lg hover:bg-brand-600 transition-colors">保存</button>
                </div>
            </div>
        </div>
    </div>
    </div>
    </main>

    <script>
        // ========== 数据管理 ==========
        var bookmarks = [];
        var currentEditingId = null;
        var categoryConfig = {};

        // 分类配置映射
        var categoryIconMap = {
            docs: { icon: 'ph-file-text', color: 'category-docs' },
            tools: { icon: 'ph-wrench', color: 'category-tools' },
            learning: { icon: 'ph-graduation-cap', color: 'category-learning' },
            design: { icon: 'ph-paint-brush', color: 'category-design' },
            community: { icon: 'ph-users', color: 'category-community' },
            other: { icon: 'ph-dots-three', color: 'category-other' }
        };

        // ========== API 请求 ==========
        async function loadBookmarks() {
            try {
                var response = await fetch('/api/bookmarks');
                var result = await response.json();
                if (result.success) {
                    bookmarks = result.data;
                    renderBookmarks();
                }
            } catch (e) {
                console.error('加载收藏失败:', e);
            }
        }

        async function loadCategories() {
            try {
                var response = await fetch('/api/bookmarks/categories');
                var result = await response.json();
                if (result.success) {
                    // 构建分类配置
                    result.data.forEach(function(c) {
                        var iconConfig = categoryIconMap[c.id] || categoryIconMap.other;
                        categoryConfig[c.id] = {
                            name: c.name,
                            icon: iconConfig.icon,
                            color: 'category-' + c.color
                        };
                    });
                    // 更新下拉框
                    var select = document.getElementById('filter-category');
                    select.innerHTML = '<option value="">全部分类</option>' +
                        result.data.map(function(c) {
                            return '<option value="' + c.id + '">' + c.name + '</option>';
                        }).join('');
                }
            } catch (e) {
                console.error('加载分类列表失败:', e);
            }
        }

        // ========== 渲染收藏列表 ==========
        function renderBookmarks() {
            var grid = document.getElementById('bookmarks-grid');
            var emptyState = document.getElementById('empty-state');
            var filterCategory = document.getElementById('filter-category').value;
            var searchKeyword = document.getElementById('search-input').value.toLowerCase();

            // 过滤数据
            var filtered = bookmarks.filter(function(bm) {
                if (filterCategory && bm.category !== filterCategory) return false;
                if (searchKeyword) {
                    var searchText = (bm.title + ' ' + bm.tags + ' ' + bm.desc).toLowerCase();
                    return searchText.indexOf(searchKeyword) !== -1;
                }
                return true;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            grid.innerHTML = filtered.map(function(bm) {
                var config = categoryConfig[bm.category] || categoryConfig.other || { name: '其他', color: 'category-other' };

                // 获取网站 favicon
                var faviconUrl = bm.favicon || ('https://www.google.com/s2/favicons?domain=' + encodeURIComponent(bm.url) + '&sz=64');

                return `
                    <div class="bookmark-card group">
                        <div class="flex items-start gap-3 mb-3">
                            <img src="${faviconUrl}" alt="" class="w-10 h-10 rounded-lg bg-gray-50 object-contain" onerror="this.src='${PAGE_BASE}assets/svg/网站.svg'">
                            <div class="flex-1 min-w-0">
                                <h4 class="font-semibold text-gray-800 truncate">${escapeHtml(bm.title)}</h4>
                                <span class="category-badge ${config.color}">${config.name}</span>
                            </div>
                        </div>
                        <p class="text-xs text-gray-400 mb-2 line-clamp-2">${escapeHtml(bm.description || '暂无描述')}</p>
                        <div class="flex items-center justify-between pt-2 border-t border-gray-50">
                            <a href="${escapeHtml(bm.url)}" target="_blank" class="text-sm text-brand-500 hover:text-brand-600 flex items-center gap-1" onclick="event.stopPropagation(); recordClick('${bm.id}')">
                                <i class="ph ph-arrow-square-out"></i> 访问
                            </a>
                            <div class="flex items-center gap-2">
                                <span class="text-xs text-gray-400">${bm.clickCount || 0} 次访问</span>
                                <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                    <button onclick="editBookmark('${bm.id}')" class="p-1.5 text-gray-400 hover:text-brand-500 hover:bg-brand-50 rounded transition-colors">
                                        <i class="ph ph-pencil"></i>
                                    </button>
                                    <button onclick="deleteBookmark('${bm.id}')" class="p-1.5 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded transition-colors">
                                        <i class="ph ph-trash"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ========== 表单操作 ==========
        function openBookmarkForm(id) {
            currentEditingId = id || null;
            document.getElementById('drawer-title').textContent = id ? '编辑收藏' : '添加收藏';
            document.getElementById('bookmark-form').reset();

            if (id) {
                var bm = bookmarks.find(function(b) { return b.id === id; });
                if (bm) {
                    document.getElementById('bookmark-id').value = bm.id;
                    document.getElementById('bookmark-title').value = bm.title;
                    document.getElementById('bookmark-url').value = bm.url;
                    document.getElementById('bookmark-category').value = bm.category;
                    document.getElementById('bookmark-tags').value = bm.tags || '';
                    document.getElementById('bookmark-desc').value = bm.desc || '';
                }
            }

            document.getElementById('bookmark-drawer').classList.remove('hidden');
            setTimeout(function() {
                document.getElementById('bookmark-drawer-panel').classList.remove('translate-x-full');
            }, 10);
        }

        function closeBookmarkForm() {
            document.getElementById('bookmark-drawer-panel').classList.add('translate-x-full');
            setTimeout(function() {
                document.getElementById('bookmark-drawer').classList.add('hidden');
            }, 300);
        }

        async function saveBookmark() {
            var title = document.getElementById('bookmark-title').value.trim();
            var url = document.getElementById('bookmark-url').value.trim();
            var category = document.getElementById('bookmark-category').value;

            if (!title) {
                alert('请输入网站名称');
                return;
            }
            if (!url) {
                alert('请输入网址');
                return;
            }
            if (!category) {
                alert('请选择分类');
                return;
            }

            // 确保 URL 有协议
            if (url.indexOf('http://') !== 0 && url.indexOf('https://') !== 0) {
                url = 'https://' + url;
            }

            var bookmarkData = {
                title: title,
                url: url,
                category: category,
                description: document.getElementById('bookmark-desc').value.trim()
            };

            try {
                var apiUrl = currentEditingId ? '/api/bookmarks/' + currentEditingId : '/api/bookmarks';
                var method = currentEditingId ? 'PUT' : 'POST';
                var response = await fetch(apiUrl, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bookmarkData)
                });
                var result = await response.json();
                if (result.success) {
                    await loadBookmarks();
                    closeBookmarkForm();
                } else {
                    alert(result.message || '保存失败');
                }
            } catch (e) {
                console.error('保存收藏失败:', e);
                alert('保存失败，请重试');
            }
        }

        function editBookmark(id) {
            openBookmarkForm(id);
        }

        async function deleteBookmark(id) {
            if (!confirm('确定删除这个收藏吗？')) return;
            try {
                var response = await fetch('/api/bookmarks/' + id, { method: 'DELETE' });
                var result = await response.json();
                if (result.success) {
                    await loadBookmarks();
                } else {
                    alert(result.message || '删除失败');
                }
            } catch (e) {
                console.error('删除收藏失败:', e);
                alert('删除失败，请重试');
            }
        }

        async function recordClick(id) {
            try {
                await fetch('/api/bookmarks/' + id + '/click', { method: 'POST' });
            } catch (e) {
                console.error('记录点击失败:', e);
            }
        }

        // ========== 工具函数 ==========
        function escapeHtml(text) {
            if (!text) return '';
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ========== 事件绑定 ==========
        document.getElementById('filter-category').addEventListener('change', renderBookmarks);
        document.getElementById('search-input').addEventListener('input', renderBookmarks);

        // ========== 初始化 ==========
        async function init() {
            await loadCategories();
            await loadBookmarks();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
