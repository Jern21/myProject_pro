<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

<script>window.PAGE_BASE='../../';</script>
    <title>信息备忘录 - 文的项目工作台</title>
    <script src="../../assets/tailwind.min.js"></script>

    <link rel="stylesheet" href="../../assets/fonts/inter.css">
<script src="../../js/tailwind-config.js"></script>

<style>
    /* 详情抽屉样式 */
    .detail-drawer-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 9998;
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s ease;
    }
    .detail-drawer-overlay.active {
        opacity: 1;
        visibility: visible;
    }
    .detail-drawer {
        position: fixed;
        top: 0;
        right: 0;
        width: 100%;
        max-width: 480px;
        height: 100%;
        background: white;
        z-index: 9999;
        transform: translateX(100%);
        transition: transform 0.3s ease;
        display: flex;
        flex-direction: column;
    }
    .detail-drawer.active {
        transform: translateX(0);
    }
    .detail-drawer-content {
        flex: 1;
        overflow-y: auto;
    }
    /* 卡片编辑按钮阻止冒泡 */
    .card-actions {
        pointer-events: auto;
    }
    .memo-card {
        cursor: pointer;
    }
    .memo-card .card-actions button {
        pointer-events: auto;
    }
    .line-clamp-3 {
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
</style>

<body class="flex h-screen overflow-hidden text-sm font-sans">

    <!-- Sidebar -->

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full overflow-hidden bg-[#f9fafb]">
    <div id="page-view" class="flex-1 flex flex-col overflow-hidden"><!-- Content Area -->
        <div class="flex-1 overflow-y-auto p-6 lg:p-8">
            <div class="max-w-[1400px] mx-auto">

                <!-- Quick Add Bar -->
                <div class="bg-white rounded-xl border border-gray-100 shadow-soft p-4 mb-6 flex items-center gap-3">
                    <div class="w-10 h-10 rounded-lg bg-brand-50 text-brand-500 flex items-center justify-center flex-shrink-0">
                        <i class="ph-fill ph-pencil-simple text-lg"></i>
                    </div>
                    <input type="text" id="quick-add-input" placeholder="快速记录一条备忘... (按 Enter 保存)" class="flex-1 text-sm outline-none text-gray-700 placeholder-gray-400">
                    <div class="flex items-center gap-2">
                        <select id="quick-add-category" class="border border-gray-200 rounded-lg px-3 py-1.5 text-xs outline-none bg-gray-50 focus:border-brand-500 text-gray-600">
                            <option value="其他">选择分类</option>
                            <option value="客户信息">客户信息</option>
                            <option value="项目笔记">项目笔记</option>
                            <option value="技术方案">技术方案</option>
                            <option value="报价参考">报价参考</option>
                            <option value="灵感记录">灵感记录</option>
                            <option value="其他">其他</option>
                        </select>
                        <button onclick="window.openMemoForm()" class="px-4 py-1.5 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-xs font-medium flex items-center gap-1.5 transition-colors">

                <!-- Two Column Layout -->

                            <!-- Divider -->

                            <!-- Tags -->
                            <h3 class="font-bold text-gray-800 text-sm mb-2 flex items-center gap-2">
                                <i class="ph-fill ph-tag text-gray-400"></i> 标签

                            <div id="tag-list" class="flex flex-wrap gap-1.5">

                            </div>
                        </div>
                    </div>

                    <!-- Right: Notes Grid -->
                    <div class="flex-1 min-w-0">

                        <!-- Filter & Sort Bar -->
                        <div class="flex items-center justify-between mb-4">
                            <div class="flex items-center gap-2">
                                <span id="current-category-label" class="text-sm text-gray-600">全部笔记</span>

                            <div class="flex items-center gap-2">
                                <input type="text" id="search-input" placeholder="搜索备忘..." class="border border-gray-200 rounded-lg px-3 py-1.5 text-xs outline-none bg-gray-50 focus:border-brand-500 text-gray-600 w-40">
                                <select id="sort-select" class="border border-gray-200 rounded-lg px-3 py-1.5 text-xs outline-none bg-gray-50 focus:border-brand-500 text-gray-600">

                        <!-- Pinned Section -->

                    </div>
                </div>

            </div>
        </div>

<!-- Detail Drawer (在 #page-view 内部，SPA 导航时随内容一起注入) -->
<div id="detail-drawer-overlay" class="detail-drawer-overlay" onclick="closeDetailDrawer()"></div>
<div id="detail-drawer" class="detail-drawer shadow-drawer">
    <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100 bg-gradient-to-r from-brand-50 to-white flex-shrink-0">
        <div class="flex items-center gap-3">
            <button onclick="closeDetailDrawer()" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white text-gray-500 hover:text-brand-600 transition-colors">
                <i class="ph ph-x text-lg"></i>
            </button>
            <div class="flex items-center gap-2">
                <i class="ph-fill ph-notebook text-brand-500"></i>
                <span class="font-bold text-gray-800">备忘详情</span>

        </div>
        <div class="flex items-center gap-2">
            <button id="drawer-pin-btn" onclick="togglePinFromDrawer()" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white text-gray-400 hover:text-brand-500 transition-colors" title="置顶">
                <i class="ph ph-push-pin text-lg"></i>
            </button>
            <button onclick="editCurrentMemo()" class="px-3 py-1.5 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-xs font-medium flex items-center gap-1.5 transition-colors shadow-sm">

            <!-- Content will be loaded dynamically -->
        </div>
    </div>
</div>

</main>

<script>
'use strict';

// ========== 数据缓存 ==========
var memoCache = [];
var memoMap = {};
var currentMemoId = null;
var currentCategory = '';
var currentKeyword = '';
var currentSort = 'updated';

// ========== 分类与标签配置 ==========
var CATEGORIES = [
    { name: '全部笔记', value: '', icon: 'ph-squares-four', color: 'brand' },
    { name: '客户信息', value: '客户信息', icon: 'ph-users', color: 'blue' },
    { name: '项目笔记', value: '项目笔记', icon: 'ph-kanban', color: 'green' },
    { name: '技术方案', value: '技术方案', icon: 'ph-code', color: 'purple' },
    { name: '报价参考', value: '报价参考', icon: 'ph-currency-cny', color: 'orange' },
    { name: '灵感记录', value: '灵感记录', icon: 'ph-lightbulb', color: 'yellow' },
    { name: '其他', value: '其他', icon: 'ph-tag', color: 'gray' }
];

var CATEGORY_COLORS = {
    '客户信息': 'blue',
    '项目笔记': 'green',
    '技术方案': 'purple',
    '报价参考': 'orange',
    '灵感记录': 'yellow',
    '其他': 'gray'
};

var TAG_COLORS = {
    '重要': 'blue',
    '紧急': 'red',
    '已处理': 'green',
    '待跟进': 'orange',
    '参考': 'purple',
    '备忘': 'gray'
};

var ALL_TAGS = ['重要', '紧急', '已处理', '待跟进', '参考', '备忘'];

// ========== 工具函数 ==========
function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
}

function formatDate(dateStr) {
    if (!dateStr) return '';
    var d = new Date(dateStr);
    var now = new Date();
    var diff = now - d;
    var sameDay = d.toDateString() === now.toDateString();
    var yesterday = new Date(now.getTime() - 86400000);
    var isYesterday = d.toDateString() === yesterday.toDateString();

    var hh = String(d.getHours()).padStart(2, '0');
    var mi = String(d.getMinutes()).padStart(2, '0');
    var mm = String(d.getMonth() + 1).padStart(2, '0');
    var dd = String(d.getDate()).padStart(2, '0');

    if (sameDay) return '今天 ' + hh + ':' + mi;
    if (isYesterday) return '昨天 ' + hh + ':' + mi;
    return mm + '-' + dd + ' ' + hh + ':' + mi;
}

// ========== API 加载 ==========
function loadMemos() {
    var params = new URLSearchParams();
    if (currentCategory) params.append('category', currentCategory);
    if (currentKeyword) params.append('keyword', currentKeyword);
    params.append('sortBy', currentSort);

    var url = '/api/memos?' + params.toString();

    return fetch(url)
        .then(function (r) { return r.json(); })
        .then(function (res) {
            if (res.success) {
                memoCache = res.data || [];
                memoMap = {};
                memoCache.forEach(function (m) { memoMap[m.id] = m; });
                renderAll();
            }
        })
        .catch(function (err) {
            console.error('加载备忘录失败:', err);
        });
}

// ========== 渲染分类侧边栏 ==========
function renderCategories() {
    var counts = {};
    counts[''] = memoCache.length;
    CATEGORIES.forEach(function (cat) {
        if (cat.value) {
            counts[cat.value] = memoCache.filter(function (m) { return m.category === cat.value; }).length;
        }
    });

    var html = CATEGORIES.map(function (cat) {
        var isActive = currentCategory === cat.value;
        var activeCls = isActive ? 'bg-brand-50 text-brand-600 font-medium' : 'text-gray-600 hover:bg-gray-50';
        var count = counts[cat.value] || 0;
        var countCls = isActive ? 'bg-white' : 'text-gray-400';
        return '<button onclick="selectCategory(\'' + cat.value + '\')" class="w-full flex items-center justify-between px-3 py-2 rounded-lg ' + activeCls + ' text-sm transition-colors">' +
            '<span class="flex items-center gap-2"><i class="ph ' + cat.icon + ' text-' + cat.color + '-500"></i> ' + cat.name + '</span>' +
            '<span class="text-[10px] ' + countCls + ' px-1.5 py-0.5 rounded-full">' + count + '</span>' +
            '</button>';
    }).join('');

    var container = document.getElementById('category-list');
    if (container) container.innerHTML = html;
}

// ========== 渲染标签列表 ==========
function renderTags() {
    var html = ALL_TAGS.map(function (tag) {
        var color = TAG_COLORS[tag] || 'gray';
        return '<span class="px-2 py-0.5 text-[10px] text-' + color + '-600 bg-' + color + '-50 border border-' + color + '-100 rounded cursor-pointer hover:bg-' + color + '-100 transition-colors">' + escapeHtml(tag) + '</span>';
    }).join('');

    var container = document.getElementById('tag-list');
    if (container) container.innerHTML = html;
}

// ========== 渲染卡片 ==========
function buildCardHtml(memo) {
    var catColor = CATEGORY_COLORS[memo.category] || 'gray';
    var tagsHtml = (memo.tags || []).map(function (tag) {
        var tColor = TAG_COLORS[tag] || 'gray';
        return '<span class="text-[10px] text-' + tColor + '-600 bg-' + tColor + '-50 border border-' + tColor + '-100 px-1.5 py-0.5 rounded">' + escapeHtml(tag) + '</span>';
    }).join('');

    var pinnedBtn = memo.pinned ?
        '<button class="absolute top-3 right-3 text-brand-500 hover:text-brand-700" onclick="event.stopPropagation(); togglePin(\'' + memo.id + '\')"><i class="ph-fill ph-push-pin text-sm"></i></button>' : '';

    var cardBg = memo.pinned ?
        'bg-gradient-to-br from-' + catColor + '-50 to-white border border-' + catColor + '-100' :
        'bg-white border border-gray-100';

    return '<div class="memo-card ' + cardBg + ' rounded-xl p-5 shadow-soft hover:shadow-md transition-shadow group relative" onclick="openDetailDrawer(\'' + memo.id + '\')">' +
        pinnedBtn +
        '<div class="flex items-center gap-2 mb-2">' +
        '<span class="text-[10px] text-' + catColor + '-600 bg-' + catColor + '-50 px-1.5 py-0.5 rounded font-medium">' + escapeHtml(memo.category || '其他') + '</span>' +
        tagsHtml +
        '</div>' +
        '<h4 class="font-bold text-gray-800 text-sm mb-2">' + escapeHtml(memo.title) + '</h4>' +
        '<p class="text-xs text-gray-600 leading-relaxed mb-3 line-clamp-3">' + escapeHtml(memo.content) + '</p>' +
        '<div class="flex items-center justify-between">' +
        '<span class="text-[10px] text-gray-400">' + formatDate(memo.updatedAt || memo.createdAt) + '</span>' +
        '<div class="card-actions flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">' +
        '<button onclick="event.stopPropagation(); togglePin(\'' + memo.id + '\')" class="w-6 h-6 rounded border border-gray-200 flex items-center justify-center text-gray-400 hover:text-brand-500 hover:bg-brand-50 transition-colors" title="置顶"><i class="ph ph-push-pin text-xs"></i></button>' +
        '<button onclick="event.stopPropagation(); editMemo(\'' + memo.id + '\')" class="w-6 h-6 rounded border border-gray-200 flex items-center justify-center text-gray-400 hover:text-brand-500 hover:bg-brand-50 transition-colors" title="编辑"><i class="ph ph-pencil-simple text-xs"></i></button>' +
        '<button onclick="event.stopPropagation(); deleteMemo(\'' + memo.id + '\')" class="w-6 h-6 rounded border border-gray-200 flex items-center justify-center text-gray-400 hover:text-red-500 hover:bg-red-50 transition-colors" title="删除"><i class="ph ph-trash text-xs"></i></button>' +
        '</div></div></div>';
}

// ========== 渲染所有 ==========
function renderAll() {
    renderCategories();
    renderTags();

    var pinned = memoCache.filter(function (m) { return m.pinned; });
    var normal = memoCache.filter(function (m) { return !m.pinned; });

    // 置顶区
    var pinnedSection = document.getElementById('pinned-section');
    var pinnedGrid = document.getElementById('pinned-grid');
    if (pinned.length > 0) {
        pinnedSection.style.display = '';
        pinnedGrid.innerHTML = pinned.map(buildCardHtml).join('');
    } else {
        pinnedSection.style.display = 'none';
    }

    // 普通区
    var notesGrid = document.getElementById('notes-grid');
    if (normal.length === 0 && pinned.length === 0) {
        notesGrid.innerHTML = '<div class="col-span-full text-center py-12 text-gray-400"><i class="ph ph-notebook text-3xl mb-2 block"></i>暂无备忘数据</div>';
    } else if (normal.length === 0) {
        notesGrid.innerHTML = '';
    } else {
        notesGrid.innerHTML = normal.map(buildCardHtml).join('');
    }

    // 统计
    document.getElementById('total-count').textContent = memoCache.length + ' 条';
    var label = currentCategory || '全部笔记';
    document.getElementById('current-category-label').textContent = label;
}

// ========== 分类切换 ==========
function selectCategory(value) {
    currentCategory = value;
    loadMemos();
}

// ========== 详情抽屉 ==========
function openDetailDrawer(id) {
    var memo = memoMap[id];
    if (!memo) return;
    currentMemoId = id;

    // 更新置顶按钮状态
    var pinBtn = document.getElementById('drawer-pin-btn');
    if (memo.pinned) {
        pinBtn.innerHTML = '<i class="ph-fill ph-push-pin text-lg text-brand-500"></i>';
    } else {
        pinBtn.innerHTML = '<i class="ph ph-push-pin text-lg"></i>';
    }

    var catColor = CATEGORY_COLORS[memo.category] || 'gray';
    var tagsHtml = (memo.tags || []).map(function (tag) {
        var tColor = TAG_COLORS[tag] || 'gray';
        return '<span class="text-[10px] text-' + tColor + '-600 bg-' + tColor + '-50 border border-' + tColor + '-100 px-2 py-1 rounded">' + escapeHtml(tag) + '</span>';
    }).join('');

    document.getElementById('drawer-content').innerHTML =
        '<div class="mb-6 border-l-4 border-brand-500 pl-4">' +
        '<div class="flex items-center gap-2 mb-3">' +
        '<span class="text-[10px] text-' + catColor + '-600 bg-' + catColor + '-50 px-2 py-1 rounded font-medium">' + escapeHtml(memo.category || '其他') + '</span>' +
        tagsHtml +
        '</div>' +
        '<h2 class="text-xl font-bold text-gray-800 mb-2">' + escapeHtml(memo.title) + '</h2>' +
        '<div class="flex items-center gap-1.5 text-xs text-gray-400">' +
        '<i class="ph ph-clock text-brand-500"></i>' +
        '<span>' + formatDate(memo.updatedAt || memo.createdAt) + '</span>' +
        '</div></div>' +
        '<div class="bg-gray-50 rounded-xl p-5">' +
        '<div class="flex items-center gap-2 mb-3">' +
        '<i class="ph-fill ph-text-t text-brand-500"></i>' +
        '<span class="text-xs font-medium text-gray-500 uppercase tracking-wider">备忘内容</span>' +
        '</div>' +
        '<div class="text-sm text-gray-700 leading-relaxed whitespace-pre-wrap">' + escapeHtml(memo.content) + '</div>' +
        '</div>';

    document.getElementById('detail-drawer-overlay').classList.add('active');
    document.getElementById('detail-drawer').classList.add('active');
    document.body.style.overflow = 'hidden';
}

function closeDetailDrawer() {
    document.getElementById('detail-drawer-overlay').classList.remove('active');
    document.getElementById('detail-drawer').classList.remove('active');
    document.body.style.overflow = '';
    currentMemoId = null;
}

// ========== 编辑 ==========
function editCurrentMemo() {
    if (currentMemoId && memoMap[currentMemoId]) {
        window.openMemoForm(memoMap[currentMemoId]);
    }
}

function editMemo(id) {
    if (memoMap[id]) {
        window.openMemoForm(memoMap[id]);
    }
}

// ========== 表单提交事件 -> 保存到后端 ==========
window.addEventListener('memo-form:submit', function (e) {
    var data = e.detail;
    var isEdit = !!data.id && memoMap[data.id];
    var apiUrl = '/api/memos';
    var method = 'POST';
    var body = {
        title: data.title,
        category: data.category,
        tags: data.tags,
        content: data.content,
        pinned: data.pinned
    };

    if (isEdit) {
        apiUrl = '/api/memos/' + data.id;
        method = 'PUT';
    }

    fetch(apiUrl, {
        method: method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
    })
    .then(function (r) { return r.json(); })
    .then(function (res) {
        if (res.success) {
            showToast(isEdit ? '备忘已更新' : '备忘已创建', 'success');
            loadMemos();
        } else {
            showToast(res.error || '保存失败', 'error');
        }
    })
    .catch(function (err) {
        console.error('保存失败:', err);
        showToast('保存失败', 'error');
    });
});

// ========== 置顶切换 ==========
function togglePin(id) {
    fetch('/api/memos/' + id + '/pin', { method: 'PUT' })
        .then(function (r) { return r.json(); })
        .then(function (res) {
            if (res.success) {
                showToast(res.data.pinned ? '已置顶' : '已取消置顶', 'success');
                // 如果详情抽屉打开，刷新
                if (currentMemoId === id) {
                    memoMap[id] = res.data;
                    openDetailDrawer(id);
                }
                loadMemos();
            }
        })
        .catch(function (err) {
            console.error('置顶失败:', err);
            showToast('操作失败', 'error');
        });
}

function togglePinFromDrawer() {
    if (currentMemoId) {
        togglePin(currentMemoId);
    }
}

// ========== 删除 ==========
function deleteMemo(id) {
    var memo = memoMap[id];
    if (!memo) return;

    if (!confirm('确定要删除「' + memo.title + '」吗？')) return;

    fetch('/api/memos/' + id, { method: 'DELETE' })
        .then(function (r) { return r.json(); })
        .then(function (res) {
            if (res.success) {
                showToast('已删除', 'success');
                if (currentMemoId === id) {
                    closeDetailDrawer();
                }
                loadMemos();
            } else {
                showToast(res.error || '删除失败', 'error');
            }
        })
        .catch(function (err) {
            console.error('删除失败:', err);
            showToast('删除失败', 'error');
        });
}

// ========== 快速添加 ==========
function quickAdd() {
    var input = document.getElementById('quick-add-input');
    var category = document.getElementById('quick-add-category').value;
    var title = input.value.trim();

    if (!title) return;

    fetch('/api/memos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            title: title,
            category: category || '其他',
            tags: [],
            content: title,
            pinned: false
        })
    })
    .then(function (r) { return r.json(); })
    .then(function (res) {
        if (res.success) {
            input.value = '';
            showToast('备忘已创建', 'success');
            loadMemos();
        }
    })
    .catch(function (err) {
        console.error('快速添加失败:', err);
        showToast('添加失败', 'error');
    });
}

// ========== Toast ==========
function showToast(message, type) {
    var toast = document.createElement('div');
    toast.className = 'fixed top-5 left-1/2 -translate-x-1/2 px-6 py-3 rounded-lg text-white text-sm z-[99999] animate-fade-in ' +
        (type === 'success' ? 'bg-green-500' : 'bg-red-500');
    toast.innerHTML = '<i class="ph ' + (type === 'success' ? 'ph-check-circle' : 'ph-warning-circle') + ' mr-2"></i>' + escapeHtml(message);
    document.body.appendChild(toast);

    setTimeout(function () {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s';
        setTimeout(function () { toast.remove(); }, 300);
    }, 2000);
}

// ========== 事件绑定 ==========
function bindEvents() {
    // 快速添加
    var quickInput = document.getElementById('quick-add-input');
    if (quickInput && !quickInput.dataset.bound) {
        quickInput.dataset.bound = 'true';
        quickInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') quickAdd();
        });
    }

    // 搜索
    var searchInput = document.getElementById('search-input');
    if (searchInput && !searchInput.dataset.bound) {
        searchInput.dataset.bound = 'true';
        var searchTimer = null;
        searchInput.addEventListener('input', function () {
            if (searchTimer) clearTimeout(searchTimer);
            searchTimer = setTimeout(function () {
                currentKeyword = searchInput.value.trim();
                loadMemos();
            }, 300);
        });
    }

    // 排序
    var sortSelect = document.getElementById('sort-select');
    if (sortSelect && !sortSelect.dataset.bound) {
        sortSelect.dataset.bound = 'true';
        sortSelect.addEventListener('change', function () {
            currentSort = sortSelect.value;
            loadMemos();
        });
    }

    // ESC 关闭
    if (!window._memoEscBound) {
        window._memoEscBound = true;
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                closeDetailDrawer();
            }
        });
    }
}

// ========== SPA cleanup ==========
window.addEventListener('spa:cleanup-forms', function () {
    closeDetailDrawer();
});

// ========== 初始化 ==========
function initMemoPage() {
    bindEvents();
    loadMemos();
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initMemoPage);
} else {
    initMemoPage();
}

window.addEventListener('spa:ready', function (e) {
    var page = (e.detail && e.detail.page) || '';
    if (page && page.indexOf('memo') === -1) return;
    initMemoPage();
});
</script>
