<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>window.PAGE_BASE='../../';</script>
    <title>账号管理 - 文的项目工作台</title>
    <script src="../../assets/tailwind.min.js"></script>
    <!-- Phosphor Icons（本地引入） -->
    <link rel="stylesheet" href="../../assets/fonts/phosphor-regular.css">
    <link rel="stylesheet" href="../../assets/fonts/phosphor-fill.css">
    <link rel="stylesheet" href="../../assets/fonts/inter.css">
    <script src="../../js/tailwind-config.js"></script>
    <script src="../../js/cdn-fallback.js"></script>
    <link rel="stylesheet" href="../../css/common.css">
    <script src="../../js/theme.js"></script>
    <!-- 统一 API 封装层 -->
    <script src="../../js/api.js"></script>
    <!-- 全局 UI 组件 -->
    <script src="../../js/ui-components.js"></script>
    <!-- 页面滚动位置记忆 -->
    <script src="../../js/scroll-memory.js"></script>
    <script src="../../js/sidebar.js"></script>
    <script src="../../js/header.js"></script>
    <script src="../../js/spa-router.js"></script>
    <script src="../../js/avatar.js"></script>
    <script src="../../js/platform-icons.js"></script>
    <style type="text/tailwindcss">
        .account-card {
            @apply bg-white rounded-xl border border-gray-100 p-5 hover:shadow-md transition-shadow cursor-pointer;
        }
        .platform-badge {
            @apply px-2 py-0.5 rounded text-xs font-medium;
        }
        .platform-github { @apply bg-gray-100 text-gray-700; }
        .platform-gitee { @apply bg-red-50 text-red-600; }
        .platform-coding { @apply bg-blue-50 text-blue-600; }
        .platform-leetcode { @apply bg-yellow-50 text-yellow-600; }
        .platform-juejin { @apply bg-blue-50 text-blue-500; }
        .platform-csdn { @apply bg-red-50 text-red-500; }
        .platform-zhihu { @apply bg-blue-50 text-blue-600; }
        .platform-other { @apply bg-gray-50 text-gray-600; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-sm">

    <!-- Sidebar -->

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full overflow-hidden bg-[#f9fafb]">
    <div id="page-view" class="flex-1 flex flex-col overflow-hidden">
        <!-- Content Area -->
        <div class="flex-1 overflow-y-auto p-6 lg:p-8">
            <div class="max-w-[1200px] mx-auto">

                <!-- Filter & Search Bar -->
                <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center gap-3">
                        <select id="filter-platform" class="border border-gray-200 rounded-lg px-3 py-2 text-sm bg-white outline-none focus:border-brand-500">
                            <option value="">全部平台</option>
                            <option value="github">GitHub</option>
                            <option value="gitee">Gitee</option>
                            <option value="coding">Coding</option>
                            <option value="leetcode">LeetCode</option>
                            <option value="juejin">掘金</option>
                            <option value="csdn">CSDN</option>
                            <option value="zhihu">知乎</option>
                            <option value="other">其他</option>
                        </select>
                        <div class="relative">
                            <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                            <input type="text" id="search-input" placeholder="搜索账号、平台..." class="pl-9 pr-4 py-2 border border-gray-200 rounded-lg text-sm w-64 outline-none focus:border-brand-500">
                        </div>
                    </div>
                    <button onclick="openAccountForm()" class="px-4 py-2 bg-brand-500 text-white rounded-lg hover:bg-brand-600 transition-colors flex items-center gap-2">
                        <i class="ph ph-plus"></i> 添加账号
                    </button>
                </div>

                <!-- Accounts Grid -->
                <div id="accounts-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- 动态渲染 -->
                </div>

                <!-- Empty State -->
                <div id="empty-state" class="hidden flex flex-col items-center justify-center py-20">
                    <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mb-4">
                        <i class="ph ph-key text-3xl text-gray-400"></i>
                    </div>
                    <p class="text-gray-500 mb-2">暂无账号记录</p>
                    <p class="text-gray-400 text-xs">点击右上角添加第一个账号</p>
                </div>

            </div>
        </div>
    <!-- Account Form Drawer -->
    <div id="account-drawer" class="fixed inset-0 z-[1000] hidden">
        <div class="absolute inset-0 bg-black/30 backdrop-blur-sm" onclick="closeAccountForm()"></div>
        <div class="absolute right-0 top-0 h-full w-[480px] bg-white shadow-2xl transform translate-x-full transition-transform duration-300" id="account-drawer-panel">
            <div class="flex flex-col h-full">
                <!-- Header -->
                <div class="flex items-center justify-between p-6 border-b border-gray-100">
                    <h3 class="text-lg font-bold text-gray-800" id="drawer-title">添加账号</h3>
                    <button onclick="closeAccountForm()" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-gray-100 transition-colors">
                        <i class="ph ph-x text-gray-500"></i>
                    </button>
                </div>

                <!-- Form Body -->
                <div class="flex-1 overflow-y-auto p-6">
                    <form id="account-form" class="space-y-5">
                        <input type="hidden" id="account-id">

                        <!-- 平台 -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">平台 <span class="text-red-500">*</span></label>
                            <select id="account-platform" class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-brand-500 bg-white" required>
                                <option value="">选择平台</option>
                                <option value="github">GitHub</option>
                                <option value="gitee">Gitee</option>
                                <option value="coding">Coding</option>
                                <option value="leetcode">LeetCode</option>
                                <option value="juejin">掘金</option>
                                <option value="csdn">CSDN</option>
                                <option value="zhihu">知乎</option>
                                <option value="other">其他</option>
                            </select>
                        </div>

                        <!-- 自定义平台名称（当选择其他时显示） -->
                        <div id="custom-platform-wrapper" class="hidden">
                            <label class="block text-sm font-medium text-gray-700 mb-2">平台名称 <span class="text-red-500">*</span></label>
                            <input type="text" id="custom-platform" class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-brand-500" placeholder="请输入平台名称">
                        </div>

                        <!-- 账号/用户名 -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">账号/用户名 <span class="text-red-500">*</span></label>
                            <input type="text" id="account-username" class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-brand-500" placeholder="请输入账号或用户名" required>
                        </div>

                        <!-- 邮箱 -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">注册邮箱</label>
                            <input type="email" id="account-email" class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-brand-500" placeholder="example@email.com">
                        </div>

                        <!-- 密码 -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">密码</label>
                            <div class="relative">
                                <input type="password" id="account-password" class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-brand-500 pr-10" placeholder="请输入密码">
                                <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                                    <i class="ph ph-eye" id="password-eye"></i>
                                </button>
                            </div>
                            <p class="text-xs text-gray-400 mt-1">密码仅在本地存储，请妥善保管</p>
                        </div>

                        <!-- 个人主页链接 -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">个人主页链接</label>
                            <input type="url" id="account-url" class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-brand-500" placeholder="https://...">
                        </div>

                        <!-- 备注 -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">备注</label>
                            <textarea id="account-notes" rows="3" class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-brand-500 resize-none" placeholder="添加备注信息..."></textarea>
                        </div>
                    </form>
                </div>

                <!-- Footer -->
                <div class="p-6 border-t border-gray-100 flex gap-3">
                    <button type="button" onclick="closeAccountForm()" class="flex-1 px-4 py-2.5 border border-gray-200 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors">取消</button>
                    <button type="button" onclick="saveAccount()" class="flex-1 px-4 py-2.5 bg-brand-500 text-white rounded-lg hover:bg-brand-600 transition-colors">保存</button>
                </div>
            </div>
        </div>
    </div>
    </div>
    </main>

    <script>
        // ========== 数据管理 ==========
        var accounts = [];
        var currentEditingId = null;
        var platformConfig = {};

        // 平台配置映射（从后端数据转换）
        var platformIconMap = {
            github: { icon: 'ph-github-logo', color: 'platform-github' },
            gitee: { icon: 'ph-git-branch', color: 'platform-gitee' },
            coding: { icon: 'ph-code', color: 'platform-coding' },
            leetcode: { icon: 'ph-code', color: 'platform-leetcode' },
            juejin: { icon: 'ph-article', color: 'platform-juejin' },
            csdn: { icon: 'ph-notebook', color: 'platform-csdn' },
            zhihu: { icon: 'ph-chat-circle-text', color: 'platform-zhihu' },
            other: { icon: 'ph-globe', color: 'platform-other' }
        };

        // ========== API 请求 ==========
        async function loadAccounts() {
            try {
                var response = await fetch('/api/accounts');
                var result = await response.json();
                if (result.success) {
                    accounts = result.data;
                    renderAccounts();
                }
            } catch (e) {
                console.error('加载账号失败:', e);
            }
        }

        async function loadPlatforms() {
            try {
                var response = await fetch('/api/accounts/platforms');
                var result = await response.json();
                if (result.success) {
                    // 构建平台配置
                    result.data.forEach(function(p) {
                        var iconConfig = platformIconMap[p.id] || platformIconMap.other;
                        platformConfig[p.id] = {
                            name: p.name,
                            icon: iconConfig.icon,
                            color: 'platform-' + p.color
                        };
                    });
                    // 更新下拉框
                    var select = document.getElementById('filter-platform');
                    select.innerHTML = '<option value="">全部平台</option>' +
                        result.data.map(function(p) {
                            return '<option value="' + p.id + '">' + p.name + '</option>';
                        }).join('');
                }
            } catch (e) {
                console.error('加载平台列表失败:', e);
            }
        }

        // ========== 渲染账号列表 ==========
        function renderAccounts() {
            var grid = document.getElementById('accounts-grid');
            var emptyState = document.getElementById('empty-state');
            var filterPlatform = document.getElementById('filter-platform').value;
            var searchKeyword = document.getElementById('search-input').value.toLowerCase();

            // 过滤数据
            var filtered = accounts.filter(function(acc) {
                if (filterPlatform && acc.platform !== filterPlatform) return false;
                if (searchKeyword) {
                    var searchText = (acc.accountName + ' ' + (platformConfig[acc.platform]?.name || '') + ' ' + acc.email).toLowerCase();
                    return searchText.indexOf(searchKeyword) !== -1;
                }
                return true;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            grid.innerHTML = filtered.map(function(acc) {
                var config = platformConfig[acc.platform] || platformConfig.other || { icon: 'ph-globe', color: 'platform-other', name: '其他' };
                var platformName = config.name || '其他';

                return `
                    <div class="account-card group" onclick="editAccount('${acc.id}')">
                        <div class="flex items-start justify-between mb-3">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-lg ${config.color} flex items-center justify-center">
                                    <i class="ph ${config.icon} text-xl"></i>
                                </div>
                                <div>
                                    <h4 class="font-semibold text-gray-800">${escapeHtml(platformName)}</h4>
                                    <p class="text-xs text-gray-400">${escapeHtml(acc.accountName)}</p>
                                </div>
                            </div>
                            <span class="platform-badge ${config.color}">${escapeHtml(platformName)}</span>
                        </div>
                        ${acc.email ? `<p class="text-sm text-gray-500 mb-2"><i class="ph ph-envelope mr-1"></i>${escapeHtml(acc.email)}</p>` : ''}
                        ${acc.remark ? `<p class="text-xs text-gray-400 mt-2 line-clamp-2">${escapeHtml(acc.remark)}</p>` : ''}
                    </div>
                `;
            }).join('');
        }

        // ========== 表单操作 ==========
        function openAccountForm(id) {
            currentEditingId = id || null;
            document.getElementById('drawer-title').textContent = id ? '编辑账号' : '添加账号';
            document.getElementById('account-form').reset();
            document.getElementById('custom-platform-wrapper').classList.add('hidden');

            if (id) {
                var acc = accounts.find(function(a) { return a.id === id; });
                if (acc) {
                    document.getElementById('account-id').value = acc.id;
                    document.getElementById('account-platform').value = acc.platform;
                    document.getElementById('account-username').value = acc.username;
                    document.getElementById('account-email').value = acc.email || '';
                    document.getElementById('account-password').value = acc.password || '';
                    document.getElementById('account-url').value = acc.url || '';
                    document.getElementById('account-notes').value = acc.notes || '';
                    if (acc.platform === 'other') {
                        document.getElementById('custom-platform').value = acc.customPlatform || '';
                        document.getElementById('custom-platform-wrapper').classList.remove('hidden');
                    }
                }
            }

            document.getElementById('account-drawer').classList.remove('hidden');
            setTimeout(function() {
                document.getElementById('account-drawer-panel').classList.remove('translate-x-full');
            }, 10);
        }

        function closeAccountForm() {
            document.getElementById('account-drawer-panel').classList.add('translate-x-full');
            setTimeout(function() {
                document.getElementById('account-drawer').classList.add('hidden');
            }, 300);
        }

        async function saveAccount() {
            var platform = document.getElementById('account-platform').value;
            var username = document.getElementById('account-username').value.trim();
            var customPlatform = document.getElementById('custom-platform').value.trim();

            if (!platform) {
                alert('请选择平台');
                return;
            }
            if (platform === 'other' && !customPlatform) {
                alert('请输入平台名称');
                return;
            }
            if (!username) {
                alert('请输入账号/用户名');
                return;
            }

            var accountData = {
                platform: platform,
                accountName: username,
                email: document.getElementById('account-email').value.trim(),
                password: document.getElementById('account-password').value,
                remark: document.getElementById('account-notes').value.trim()
            };

            try {
                var url = currentEditingId ? '/api/accounts/' + currentEditingId : '/api/accounts';
                var method = currentEditingId ? 'PUT' : 'POST';
                var response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(accountData)
                });
                var result = await response.json();
                if (result.success) {
                    await loadAccounts();
                    closeAccountForm();
                } else {
                    alert(result.message || '保存失败');
                }
            } catch (e) {
                console.error('保存账号失败:', e);
                alert('保存失败，请重试');
            }
        }

        function editAccount(id) {
            openAccountForm(id);
        }

        async function deleteAccount(id) {
            if (!confirm('确定删除这个账号吗？')) return;
            try {
                var response = await fetch('/api/accounts/' + id, { method: 'DELETE' });
                var result = await response.json();
                if (result.success) {
                    await loadAccounts();
                } else {
                    alert(result.message || '删除失败');
                }
            } catch (e) {
                console.error('删除账号失败:', e);
                alert('删除失败，请重试');
            }
        }

        function togglePasswordVisibility() {
            var input = document.getElementById('account-password');
            var eye = document.getElementById('password-eye');
            if (input.type === 'password') {
                input.type = 'text';
                eye.classList.remove('ph-eye');
                eye.classList.add('ph-eye-slash');
            } else {
                input.type = 'password';
                eye.classList.remove('ph-eye-slash');
                eye.classList.add('ph-eye');
            }
        }

        // ========== 工具函数 ==========
        function escapeHtml(text) {
            if (!text) return '';
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ========== 事件绑定 ==========
        document.getElementById('account-platform').addEventListener('change', function() {
            if (this.value === 'other') {
                document.getElementById('custom-platform-wrapper').classList.remove('hidden');
            } else {
                document.getElementById('custom-platform-wrapper').classList.add('hidden');
            }
        });

        document.getElementById('filter-platform').addEventListener('change', renderAccounts);
        document.getElementById('search-input').addEventListener('input', renderAccounts);

        // ========== 初始化 ==========
        async function init() {
            await loadPlatforms();
            await loadAccounts();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
