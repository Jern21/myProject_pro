<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>window.PAGE_BASE='../../';</script>
    <title>日期提醒 - 文的项目工作台</title>
    <script src="../../assets/tailwind.min.js"></script>
    <!-- Phosphor Icons（本地引入） -->
    <link rel="stylesheet" href="../../assets/fonts/phosphor-regular.css">
    <link rel="stylesheet" href="../../assets/fonts/phosphor-fill.css">
    <link rel="stylesheet" href="../../assets/fonts/inter.css">
<script src="../../js/tailwind-config.js"></script>
<script src="../../js/cdn-fallback.js"></script>
    <link rel="stylesheet" href="../../css/common.css">
<script src="../../js/theme.js"></script>
    <style>
        /* ========== 提醒项卡片 ========== */
        .reminder-card {
            background-color: #fff;
            border-radius: 0.75rem;
            border: 1px solid #f1f5f9;
            box-shadow: 0 4px 20px -2px rgba(0,0,0,0.05);
            padding: 1rem;
            transition: all 0.15s ease;
        }
        .reminder-card:hover {
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            border-color: #e2e8f0;
        }
        .reminder-card.urgent {
            border-left-width: 4px;
            border-left-color: #f87171;
        }
        .reminder-card.normal {
            border-left-width: 4px;
            border-left-color: #60a5fa;
        }
        .reminder-card.done {
            opacity: 0.6;
        }
        .reminder-card.done .reminder-title {
            text-decoration: line-through;
            color: #94a3b8;
        }
        /* ========== 优先级标签 ========== */
        .pri-high { background-color: #fef2f2; color: #ef4444; border-color: #fee2e2; }
        .pri-medium { background-color: #fff7ed; color: #f97316; border-color: #ffedd5; }
        .pri-low { background-color: #f0fdf4; color: #22c55e; border-color: #dcfce7; }
        /* ========== 分类标签（5个默认 + 3个动态颜色） ========== */
        .cat-work { background-color: #eff6ff; color: #3b82f6; }
        .cat-order { background-color: #faf5ff; color: #a855f7; }
        .cat-meeting { background-color: #ecfeff; color: #06b6d4; }
        .cat-personal { background-color: #fffbeb; color: #d97706; }
        .cat-deadline { background-color: #fef2f2; color: #ef4444; }
        .cat-green { background-color: #f0fdf4; color: #22c55e; }
        .cat-pink { background-color: #fdf2f8; color: #ec4899; }
        .cat-indigo { background-color: #eef2ff; color: #6366f1; }
        /* ========== 模态框 ========== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.35);
        }
        .modal-panel {
            background-color: #fff;
            border-radius: 1rem;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
            width: 100%;
            max-width: 32rem;
            max-height: 90vh;
            overflow-y: auto;
        }
        /* ========== 日历单元格 ========== */
        .cal-day {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.875rem;
            transition: background-color 0.15s ease;
            position: relative;
        }
        .cal-day:hover { background-color: #f3f4f6; }
        .cal-day.today {
            background-color: #3b82f6;
            color: #fff;
            font-weight: 700;
            box-shadow: 0 1px 3px 0 rgba(59,130,246,0.3);
        }
        .cal-day.other-month { color: #cbd5e1; }
        .cal-day.has-reminder::after {
            content: '';
            position: absolute;
            bottom: 4px;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background-color: #60a5fa;
        }
        .cal-day.today.has-reminder::after {
            background-color: #fff;
        }
        /* ========== 开关样式 ========== */
        .toggle-switch {
            position: relative;
            display: inline-flex;
            align-items: center;
            width: 2.5rem;
            height: 1.25rem;
            border-radius: 9999px;
            transition: background-color 0.15s ease;
            cursor: pointer;
        }
        .toggle-switch.on { background-color: #3b82f6; }
        .toggle-switch.off { background-color: #d1d5db; }
        .toggle-switch .toggle-dot {
            position: absolute;
            left: 2px;
            width: 1rem;
            height: 1rem;
            background-color: #fff;
            border-radius: 9999px;
            box-shadow: 0 1px 2px 0 rgba(0,0,0,0.1);
            transition: transform 0.15s ease;
        }
        .toggle-switch.on .toggle-dot { transform: translateX(1.25rem); }
        /* ========== 筛选按钮 ========== */
        .filter-btn { color: #6b7280; background: transparent; }
        .filter-btn:hover { background: #f3f4f6; }
        .filter-btn.active { background: #eff6ff; color: #2563eb; }
    </style>
    <script src="../../js/sidebar.js"></script>
<script src="../../js/header.js"></script>
<script src="../../js/spa-router.js"></script>

</head>
<body class="flex h-screen overflow-hidden text-sm font-sans">

    <!-- Sidebar -->

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full overflow-hidden bg-[#f9fafb]">
    <div id="page-view" class="flex-1 flex flex-col overflow-hidden"><!-- Content Area -->
        <div class="flex-1 overflow-y-auto p-6 lg:p-8">
            <div class="max-w-[1400px] mx-auto space-y-6">

                <!-- 顶部统计卡片 -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="card flex items-center gap-3">
                        <div class="w-10 h-10 rounded-lg bg-red-50 text-red-500 flex items-center justify-center flex-shrink-0">
                            <i class="ph-fill ph-bell-ringing text-xl"></i>
                        </div>
                        <div>
                            <p class="text-xs text-gray-400">今日待办</p>
                            <h3 class="text-xl font-bold text-gray-800" id="stat-today">0</h3>
                        </div>
                    </div>
                    <div class="card flex items-center gap-3">
                        <div class="w-10 h-10 rounded-lg bg-orange-50 text-orange-500 flex items-center justify-center flex-shrink-0">
                            <i class="ph-fill ph-calendar-x text-xl"></i>
                        </div>
                        <div>
                            <p class="text-xs text-gray-400">即将到期</p>
                            <h3 class="text-xl font-bold text-gray-800" id="stat-soon">0</h3>
                        </div>
                    </div>
                    <div class="card flex items-center gap-3">
                        <div class="w-10 h-10 rounded-lg bg-green-50 text-green-500 flex items-center justify-center flex-shrink-0">
                            <i class="ph-fill ph-check-circle text-xl"></i>
                        </div>
                        <div>
                            <p class="text-xs text-gray-400">已完成</p>
                            <h3 class="text-xl font-bold text-gray-800" id="stat-done">0</h3>
                        </div>
                    </div>
                    <div class="card flex items-center gap-3">
                        <div class="w-10 h-10 rounded-lg bg-blue-50 text-blue-500 flex items-center justify-center flex-shrink-0">
                            <i class="ph-fill ph-list-checks text-xl"></i>
                        </div>
                        <div>
                            <p class="text-xs text-gray-400">全部提醒</p>
                            <h3 class="text-xl font-bold text-gray-800" id="stat-total">0</h3>
                        </div>
                    </div>
                </div>

                <!-- 主体：左侧日历 + 右侧提醒列表 -->
                <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">

                    <!-- 左侧：日历 -->
                    <div class="card xl:col-span-1">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-semibold text-gray-800 text-base flex items-center gap-2">
                                <i class="ph-fill ph-calendar-blank text-brand-500"></i>日历
                            </h3>
                            <div class="flex items-center gap-2">
                                <button id="cal-prev" class="w-7 h-7 rounded-lg border border-gray-200 flex items-center justify-center text-gray-500 hover:bg-gray-50 transition-colors">
                                    <i class="ph ph-caret-left"></i>
                                </button>
                                <span id="cal-title" class="text-sm font-medium text-gray-700 min-w-[80px] text-center"></span>
                                <button id="cal-next" class="w-7 h-7 rounded-lg border border-gray-200 flex items-center justify-center text-gray-500 hover:bg-gray-50 transition-colors">
                                    <i class="ph ph-caret-right"></i>
                                </button>
                            </div>
                        </div>
                        <div class="grid grid-cols-7 text-center text-xs text-gray-400 mb-2">
                            <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
                        </div>
                        <div id="cal-grid" class="grid grid-cols-7 gap-1"></div>

                        <!-- 日历图例 -->
                        <div class="flex items-center justify-center gap-4 mt-4 pt-3 border-t border-gray-50">
                            <span class="flex items-center gap-1 text-[10px] text-gray-400">
                                <span class="w-1.5 h-1.5 rounded-full bg-brand-400"></span>有提醒
                            </span>
                            <span class="flex items-center gap-1 text-[10px] text-gray-400">
                                <span class="w-2 h-2 rounded bg-brand-500"></span>今天
                            </span>
                        </div>
                    </div>

                    <!-- 右侧：提醒列表 -->
                    <div class="xl:col-span-2 flex flex-col">
                        <!-- 筛选 + 添加 -->
                        <div class="card flex items-center justify-between gap-3 flex-wrap mb-4">
                            <div class="flex items-center gap-2 flex-wrap">
                                <button class="filter-btn active px-3 py-1.5 rounded-lg text-xs font-medium transition-colors" data-filter="all">全部</button>
                                <button class="filter-btn px-3 py-1.5 rounded-lg text-xs font-medium transition-colors" data-filter="today">今日</button>
                                <button class="filter-btn px-3 py-1.5 rounded-lg text-xs font-medium transition-colors" data-filter="soon">7天内</button>
                                <button class="filter-btn px-3 py-1.5 rounded-lg text-xs font-medium transition-colors" data-filter="overdue">已逾期</button>
                                <button class="filter-btn px-3 py-1.5 rounded-lg text-xs font-medium transition-colors" data-filter="done">已完成</button>
                            </div>
                            <button id="add-reminder-btn" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-xs font-medium flex items-center gap-1.5 transition-colors flex-shrink-0">
                                <i class="ph ph-plus"></i> 新建提醒
                            </button>
                        </div>

                        <!-- 提醒列表 - 双列布局，最大高度与日历齐平，支持滚动 -->
                        <div class="card flex-1 overflow-hidden">
                            <div id="reminder-list" class="grid grid-cols-1 md:grid-cols-2 gap-3 overflow-y-auto max-h-[420px] p-1"></div>

                            <!-- 空状态 -->
                            <div id="empty-state" class="hidden text-center py-12">
                                <i class="ph ph-bell-slash text-5xl text-gray-200 mb-3 block"></i>
                                <p class="text-gray-400 text-sm">暂无提醒事项</p>
                                <p class="text-gray-300 text-xs mt-1">点击「新建提醒」添加你的第一个待办</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 底部：提醒配置 -->
                <div class="card">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-semibold text-gray-800 text-base flex items-center gap-2">
                            <i class="ph-fill ph-gear-six text-brand-500"></i>提醒配置
                        </h3>
                        <button id="add-category-btn" class="text-xs text-brand-500 hover:text-brand-600 flex items-center gap-1 transition-colors">
                            <i class="ph ph-plus"></i> 新增分类
                        </button>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <!-- 通知设置 -->
                        <div>
                            <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">通知方式</h4>
                            <div class="space-y-3">
                                <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                                    <div class="flex items-center gap-3">
                                        <div class="w-8 h-8 rounded-lg bg-blue-100 text-blue-500 flex items-center justify-center">
                                            <i class="ph-fill ph-bell text-sm"></i>
                                        </div>
                                        <div>
                                            <p class="text-sm text-gray-700 font-medium">浏览器通知</p>
                                            <p class="text-[10px] text-gray-400">到期前在浏览器弹窗提醒</p>
                                        </div>
                                    </div>
                                    <div class="toggle-switch on" data-config="browser_notify"><div class="toggle-dot"></div></div>
                                </div>
                                <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                                    <div class="flex items-center gap-3">
                                        <div class="w-8 h-8 rounded-lg bg-orange-100 text-orange-500 flex items-center justify-center">
                                            <i class="ph-fill ph-clock-countdown text-sm"></i>
                                        </div>
                                        <div>
                                            <p class="text-sm text-gray-700 font-medium">提前提醒</p>
                                            <p class="text-[10px] text-gray-400">在到期前指定时间推送通知</p>
                                        </div>
                                    </div>
                                    <select id="advance-time" class="border border-gray-200 rounded-lg px-2 py-1 text-xs outline-none bg-white text-gray-600">
                                        <option value="0">准时</option>
                                        <option value="1" selected>提前1小时</option>
                                        <option value="3">提前3小时</option>
                                        <option value="24">提前1天</option>
                                        <option value="72">提前3天</option>
                                    </select>
                                </div>
                                <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                                    <div class="flex items-center gap-3">
                                        <div class="w-8 h-8 rounded-lg bg-red-100 text-red-500 flex items-center justify-center">
                                            <i class="ph-fill ph-warning text-sm"></i>
                                        </div>
                                        <div>
                                            <p class="text-sm text-gray-700 font-medium">逾期高亮</p>
                                            <p class="text-[10px] text-gray-400">超过截止时间的提醒标红显示</p>
                                        </div>
                                    </div>
                                    <div class="toggle-switch on" data-config="overdue_highlight"><div class="toggle-dot"></div></div>
                                </div>
                                <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                                    <div class="flex items-center gap-3">
                                        <div class="w-8 h-8 rounded-lg bg-green-100 text-green-500 flex items-center justify-center">
                                            <i class="ph-fill ph-arrows-clockwise text-sm"></i>
                                        </div>
                                        <div>
                                            <p class="text-sm text-gray-700 font-medium">自动归档</p>
                                            <p class="text-[10px] text-gray-400">完成后7天自动归档隐藏</p>
                                        </div>
                                    </div>
                                    <div class="toggle-switch off" data-config="auto_archive"><div class="toggle-dot"></div></div>
                                </div>
                            </div>
                        </div>

                        <!-- 分类管理 -->
                        <div>
                            <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">提醒分类</h4>
                            <div id="category-list" class="space-y-2"></div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</main>

    <!-- ========== 新建/编辑提醒 模态框 ========== -->
    <div id="reminder-modal" class="modal-overlay hidden">
        <div class="modal-panel">
            <div class="flex justify-between items-center p-5 border-b border-gray-100">
                <h3 class="font-semibold text-gray-800 text-base" id="modal-title">新建提醒</h3>
                <button id="modal-close" class="text-gray-400 hover:text-gray-600 transition-colors">
                    <i class="ph ph-x text-lg"></i>
                </button>
            </div>
            <div class="p-5 space-y-4">
                <!-- 标题 -->
                <div>
                    <label class="block text-xs text-gray-500 mb-1.5">提醒标题 <span class="text-red-500">*</span></label>
                    <input type="text" id="form-title" placeholder="如：客户需求确认截止" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-brand-500 transition-colors">
                </div>
                <!-- 描述 -->
                <div>
                    <label class="block text-xs text-gray-500 mb-1.5">详细描述</label>
                    <textarea id="form-desc" rows="2" placeholder="补充说明..." class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-brand-500 transition-colors resize-none"></textarea>
                </div>
                <!-- 日期 + 时间 -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-gray-500 mb-1.5">截止日期 <span class="text-red-500">*</span></label>
                        <input type="date" id="form-date" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-brand-500 transition-colors">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 mb-1.5">截止时间</label>
                        <input type="time" id="form-time" value="09:00" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-brand-500 transition-colors">
                    </div>
                </div>
                <!-- 分类 + 优先级 -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-gray-500 mb-1.5">分类</label>
                        <select id="form-category" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none bg-white focus:border-brand-500 transition-colors"></select>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 mb-1.5">优先级</label>
                        <select id="form-priority" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none bg-white focus:border-brand-500 transition-colors">
                            <option value="high">高 — 紧急重要</option>
                            <option value="medium" selected>中 — 正常处理</option>
                            <option value="low">低 — 有空再做</option>
                        </select>
                    </div>
                </div>
                <!-- 重复设置 -->
                <div>
                    <label class="block text-xs text-gray-500 mb-1.5">重复</label>
                    <div class="flex gap-2 flex-wrap">
                        <button class="repeat-btn px-3 py-1.5 rounded-lg border border-gray-200 text-xs text-gray-600 hover:bg-gray-50 transition-colors active" data-repeat="none">不重复</button>
                        <button class="repeat-btn px-3 py-1.5 rounded-lg border border-gray-200 text-xs text-gray-600 hover:bg-gray-50 transition-colors" data-repeat="daily">每天</button>
                        <button class="repeat-btn px-3 py-1.5 rounded-lg border border-gray-200 text-xs text-gray-600 hover:bg-gray-50 transition-colors" data-repeat="weekly">每周</button>
                        <button class="repeat-btn px-3 py-1.5 rounded-lg border border-gray-200 text-xs text-gray-600 hover:bg-gray-50 transition-colors" data-repeat="monthly">每月</button>
                    </div>
                </div>
            </div>
            <div class="flex justify-end gap-3 p-5 border-t border-gray-100">
                <button id="modal-cancel" class="px-4 py-2 border border-gray-200 rounded-lg text-sm text-gray-600 hover:bg-gray-50 transition-colors">取消</button>
                <button id="modal-save" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-sm font-medium transition-colors">保存</button>
            </div>
        </div>
    </div>

    <!-- ========== 分类管理 模态框 ========== -->
    <div id="category-modal" class="modal-overlay hidden">
        <div class="modal-panel max-w-md">
            <div class="flex justify-between items-center p-5 border-b border-gray-100">
                <h3 class="font-semibold text-gray-800 text-base">新增分类</h3>
                <button id="cat-modal-close" class="text-gray-400 hover:text-gray-600 transition-colors">
                    <i class="ph ph-x text-lg"></i>
                </button>
            </div>
            <div class="p-5 space-y-4">
                <div>
                    <label class="block text-xs text-gray-500 mb-1.5">分类名称 <span class="text-red-500">*</span></label>
                    <input type="text" id="cat-form-name" placeholder="如：账单缴费" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-brand-500 transition-colors">
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1.5">颜色标识</label>
                    <div class="flex gap-2 flex-wrap" id="cat-color-picker">
                        <button class="cat-color-btn w-8 h-8 rounded-lg bg-blue-400 ring-2 ring-offset-2 ring-blue-400" data-color="blue" data-cls="cat-work"></button>
                        <button class="cat-color-btn w-8 h-8 rounded-lg bg-purple-400" data-color="purple" data-cls="cat-order"></button>
                        <button class="cat-color-btn w-8 h-8 rounded-lg bg-cyan-400" data-color="cyan" data-cls="cat-meeting"></button>
                        <button class="cat-color-btn w-8 h-8 rounded-lg bg-amber-400" data-color="amber" data-cls="cat-personal"></button>
                        <button class="cat-color-btn w-8 h-8 rounded-lg bg-red-400" data-color="red" data-cls="cat-deadline"></button>
                        <button class="cat-color-btn w-8 h-8 rounded-lg bg-green-400" data-color="green" data-cls="cat-green"></button>
                        <button class="cat-color-btn w-8 h-8 rounded-lg bg-pink-400" data-color="pink" data-cls="cat-pink"></button>
                        <button class="cat-color-btn w-8 h-8 rounded-lg bg-indigo-400" data-color="indigo" data-cls="cat-indigo"></button>
                    </div>
                </div>
            </div>
            <div class="flex justify-end gap-3 p-5 border-t border-gray-100">
                <button id="cat-modal-cancel" class="px-4 py-2 border border-gray-200 rounded-lg text-sm text-gray-600 hover:bg-gray-50 transition-colors">取消</button>
                <button id="cat-modal-save" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-sm font-medium transition-colors">添加</button>
            </div>
        </div>
    </div>

    <!-- ========== 删除确认 ========== -->
    <div id="delete-modal" class="modal-overlay hidden">
        <div class="modal-panel max-w-sm">
            <div class="p-6 text-center">
                <div class="w-14 h-14 rounded-full bg-red-50 text-red-500 flex items-center justify-center mx-auto mb-4">
                    <i class="ph-fill ph-warning text-2xl"></i>
                </div>
                <h3 class="font-semibold text-gray-800 text-base mb-2">确认删除？</h3>
                <p class="text-sm text-gray-500 mb-5" id="delete-text">删除后将无法恢复，确定要删除这条提醒吗？</p>
                <div class="flex gap-3">
                    <button id="delete-cancel" class="flex-1 px-4 py-2 border border-gray-200 rounded-lg text-sm text-gray-600 hover:bg-gray-50 transition-colors">取消</button>
                    <button id="delete-confirm" class="flex-1 px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-lg text-sm font-medium transition-colors">删除</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] px-4 py-2 bg-gray-800 text-white text-sm rounded-lg shadow-lg opacity-0 pointer-events-none transition-all duration-300"></div>

    <script>
    (function () {
        'use strict';

        // ========== 数据存储 ==========
        var STORAGE_KEY = 'reminder_data_v1';
        var CONFIG_KEY = 'reminder_config_v1';
        var CATEGORY_KEY = 'reminder_categories_v1';

        var defaultCategories = [
            { name: '工作待办', cls: 'cat-work', color: 'blue' },
            { name: '订单截止', cls: 'cat-order', color: 'purple' },
            { name: '会议日程', cls: 'cat-meeting', color: 'cyan' },
            { name: '个人事务', cls: 'cat-personal', color: 'amber' },
            { name: '项目里程碑', cls: 'cat-deadline', color: 'red' }
        ];

        var defaultReminders = [
            { id: 1, title: '客户需求确认截止', desc: '张先生企业官网需求需在今日确认', date: todayStr(), time: '18:00', category: '订单截止', priority: 'high', repeat: 'none', done: false },
            { id: 2, title: '后台管理系统上线', desc: '刘总项目需在7月6日前完成部署', date: addDaysStr(2), time: '10:00', category: '项目里程碑', priority: 'high', repeat: 'none', done: false },
            { id: 3, title: '周报提交', desc: '每周五下午提交工作周报', date: addDaysStr(3), time: '17:00', category: '工作待办', priority: 'medium', repeat: 'weekly', done: false },
            { id: 4, title: '闲鱼商品上新', desc: '上架3款新的设计服务商品', date: addDaysStr(5), time: '14:00', category: '工作待办', priority: 'medium', repeat: 'none', done: false },
            { id: 5, title: '小程序验收会议', desc: '与赵先生线上会议确认验收细节', date: addDaysStr(7), time: '15:30', category: '会议日程', priority: 'medium', repeat: 'none', done: false },
            { id: 6, title: '房租缴纳', desc: '每月10号前缴纳房租', date: addDaysStr(6), time: '09:00', category: '个人事务', priority: 'low', repeat: 'monthly', done: false },
            { id: 7, title: '海报设计初稿交付', desc: '陈女士海报设计初稿需在7月2日交付', date: addDaysStr(-2), time: '12:00', category: '订单截止', priority: 'high', repeat: 'none', done: true }
        ];

        var defaultConfig = {
            browser_notify: true,
            overdue_highlight: true,
            auto_archive: false,
            advance_hours: 1
        };

        var reminders = [];
        var categories = [];
        var config = {};
        var currentFilter = 'all';
        var calYear, calMonth;
        var editingId = null;
        var deletingId = null;
        var selectedRepeat = 'none';
        var selectedCatColor = { color: 'blue', cls: 'cat-work' };

        // ========== 工具函数 ==========
        function todayStr() {
            var d = new Date();
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }
        function addDaysStr(n) {
            var d = new Date();
            d.setDate(d.getDate() + n);
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }
        function daysUntil(dateStr) {
            var target = new Date(dateStr + 'T00:00:00');
            var today = new Date();
            today.setHours(0, 0, 0, 0);
            return Math.round((target - today) / 86400000);
        }
        function formatDate(dateStr) {
            if (!dateStr) return '';
            var parts = dateStr.split('-');
            return parts[1] + '-' + parts[2];
        }
        function isOverdue(r) {
            if (r.done) return false;
            return daysUntil(r.date) < 0;
        }
        function isToday(r) {
            return r.date === todayStr();
        }
        function isSoon(r) {
            var d = daysUntil(r.date);
            return d >= 0 && d <= 7;
        }
        function priorityLabel(p) {
            return { high: '高', medium: '中', low: '低' }[p] || '中';
        }
        function repeatLabel(r) {
            return { none: '不重复', daily: '每天', weekly: '每周', monthly: '每月' }[r] || '不重复';
        }
        function getCategoryCls(name) {
            var cat = categories.find(function (c) { return c.name === name; });
            return cat ? cat.cls : 'cat-work';
        }
        function nextId() {
            return reminders.length ? Math.max.apply(null, reminders.map(function (r) { return r.id; })) + 1 : 1;
        }
        function showToast(msg) {
            var t = document.getElementById('toast');
            t.textContent = msg;
            t.style.opacity = '1';
            t.style.transform = 'translateX(-50%) translateY(0)';
            setTimeout(function () {
                t.style.opacity = '0';
                t.style.transform = 'translateX(-50%) translateY(10px)';
            }, 2200);
        }

        // ========== 数据加载/保存 ==========
        function loadData() {
            try {
                var raw = localStorage.getItem(STORAGE_KEY);
                reminders = raw ? JSON.parse(raw) : defaultReminders.slice();
            } catch (e) { reminders = defaultReminders.slice(); }

            try {
                var craw = localStorage.getItem(CATEGORY_KEY);
                categories = craw ? JSON.parse(craw) : defaultCategories.slice();
            } catch (e) { categories = defaultCategories.slice(); }

            try {
                var cfig = localStorage.getItem(CONFIG_KEY);
                config = cfig ? JSON.parse(cfig) : Object.assign({}, defaultConfig);
            } catch (e) { config = Object.assign({}, defaultConfig); }
        }
        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(reminders));
                localStorage.setItem(CATEGORY_KEY, JSON.stringify(categories));
                localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
            } catch (e) {}
        }

        // ========== 渲染提醒列表 ==========
        function getFilteredReminders() {
            var list = reminders.filter(function (r) {
                if (currentFilter === 'all') return true;
                if (currentFilter === 'today') return isToday(r) && !r.done;
                if (currentFilter === 'soon') return isSoon(r) && !r.done;
                if (currentFilter === 'overdue') return isOverdue(r);
                if (currentFilter === 'done') return r.done;
                return true;
            });
            // 排序：未完成在前，按日期升序
            list.sort(function (a, b) {
                if (a.done !== b.done) return a.done ? 1 : -1;
                return a.date.localeCompare(b.date);
            });
            return list;
        }

        function buildReminderCard(r) {
            var overdue = isOverdue(r);
            var days = daysUntil(r.date);
            var urgencyClass = r.priority === 'high' || overdue ? 'urgent' : 'normal';
            if (r.done) urgencyClass = 'done';

            var catCls = getCategoryCls(r.category);
            var priCls = 'pri-' + (r.priority || 'medium');

            // 时间标签
            var badge = '';
            if (r.done) {
                badge = '<span class="text-[10px] text-green-500 bg-green-50 px-1.5 py-0.5 rounded">已完成</span>';
            } else if (overdue) {
                badge = '<span class="text-[10px] text-red-500 bg-red-50 px-1.5 py-0.5 rounded font-medium">已逾期 ' + Math.abs(days) + '天</span>';
            } else if (days === 0) {
                badge = '<span class="text-[10px] text-orange-500 bg-orange-50 px-1.5 py-0.5 rounded font-medium">今天</span>';
            } else if (days <= 3) {
                badge = '<span class="text-[10px] text-orange-500 bg-orange-50 px-1.5 py-0.5 rounded">' + days + '天后</span>';
            } else {
                badge = '<span class="text-[10px] text-gray-400 bg-gray-50 px-1.5 py-0.5 rounded">' + days + '天后</span>';
            }

            var repeatBadge = r.repeat !== 'none'
                ? '<span class="text-[10px] text-blue-500 bg-blue-50 px-1.5 py-0.5 rounded flex items-center gap-0.5"><i class="ph ph-arrows-clockwise text-[9px]"></i>' + repeatLabel(r.repeat) + '</span>'
                : '';

            return '<div class="reminder-card ' + urgencyClass + '" data-id="' + r.id + '">'
                + '<div class="flex items-start gap-3">'
                + '<button class="toggle-done-btn mt-0.5 w-5 h-5 rounded-full border-2 ' + (r.done ? 'border-green-400 bg-green-400 text-white' : 'border-gray-300 hover:border-brand-400') + ' flex items-center justify-center flex-shrink-0 transition-colors">'
                + (r.done ? '<i class="ph-bold ph-check text-[10px]"></i>' : '')
                + '</button>'
                + '<div class="flex-1 min-w-0">'
                + '<div class="flex items-center gap-2 mb-1 flex-wrap">'
                + '<span class="text-[10px] ' + catCls + ' px-1.5 py-0.5 rounded font-medium">' + r.category + '</span>'
                + '<span class="text-[10px] ' + priCls + ' border px-1.5 py-0.5 rounded">优先级 ' + priorityLabel(r.priority) + '</span>'
                + badge
                + repeatBadge
                + '</div>'
                + '<h4 class="reminder-title font-medium text-gray-800 text-sm">' + r.title + '</h4>'
                + (r.desc ? '<p class="text-xs text-gray-500 mt-1 line-clamp-2">' + r.desc + '</p>' : '')
                + '<div class="flex items-center gap-3 mt-2 text-[10px] text-gray-400">'
                + '<span class="flex items-center gap-1"><i class="ph ph-calendar"></i>' + formatDate(r.date) + '</span>'
                + '<span class="flex items-center gap-1"><i class="ph ph-clock"></i>' + (r.time || '09:00') + '</span>'
                + '</div>'
                + '</div>'
                + '<div class="flex flex-col gap-1 flex-shrink-0">'
                + '<button class="edit-btn w-7 h-7 rounded-lg border border-gray-200 flex items-center justify-center text-gray-400 hover:text-brand-500 hover:bg-brand-50 transition-colors"><i class="ph ph-pencil-simple text-xs"></i></button>'
                + '<button class="delete-btn w-7 h-7 rounded-lg border border-gray-200 flex items-center justify-center text-gray-400 hover:text-red-500 hover:bg-red-50 transition-colors"><i class="ph ph-trash text-xs"></i></button>'
                + '</div>'
                + '</div>'
                + '</div>';
        }

        function renderList() {
            var container = document.getElementById('reminder-list');
            var empty = document.getElementById('empty-state');
            var list = getFilteredReminders();

            if (list.length === 0) {
                container.innerHTML = '';
                empty.classList.remove('hidden');
            } else {
                empty.classList.add('hidden');
                container.innerHTML = list.map(buildReminderCard).join('');
            }
            renderStats();
        }

        // ========== 统计 ==========
        function renderStats() {
            var today = reminders.filter(function (r) { return isToday(r) && !r.done; }).length;
            var soon = reminders.filter(function (r) { return isSoon(r) && !r.done; }).length;
            var done = reminders.filter(function (r) { return r.done; }).length;
            var total = reminders.length;

            var el;
            if ((el = document.getElementById('stat-today'))) el.textContent = today;
            if ((el = document.getElementById('stat-soon'))) el.textContent = soon;
            if ((el = document.getElementById('stat-done'))) el.textContent = done;
            if ((el = document.getElementById('stat-total'))) el.textContent = total;
        }

        // ========== 日历 ==========
        function renderCalendar() {
            var grid = document.getElementById('cal-grid');
            var title = document.getElementById('cal-title');
            if (!grid || !title) return;

            title.textContent = calYear + '年' + (calMonth + 1) + '月';

            var firstDay = new Date(calYear, calMonth, 1).getDay();
            var daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
            var daysInPrev = new Date(calYear, calMonth, 0).getDate();
            var today = todayStr();

            // 收集有提醒的日期
            var reminderDates = {};
            reminders.forEach(function (r) {
                if (!r.done) reminderDates[r.date] = true;
            });

            var html = '';
            // 上月填充
            for (var i = firstDay - 1; i >= 0; i--) {
                var d = daysInPrev - i;
                var m = calMonth === 0 ? 12 : calMonth;
                var y = calMonth === 0 ? calYear - 1 : calYear;
                var ds = y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
                var hasRem = reminderDates[ds] ? ' has-reminder' : '';
                html += '<div class="cal-day other-month' + hasRem + '">' + d + '</div>';
            }
            // 本月
            for (var j = 1; j <= daysInMonth; j++) {
                var ds2 = calYear + '-' + String(calMonth + 1).padStart(2, '0') + '-' + String(j).padStart(2, '0');
                var cls = 'cal-day';
                if (ds2 === today) cls += ' today';
                if (reminderDates[ds2]) cls += ' has-reminder';
                html += '<div class="' + cls + '" data-date="' + ds2 + '">' + j + '</div>';
            }
            // 下月填充
            var totalCells = firstDay + daysInMonth;
            var fillCount = (7 - (totalCells % 7)) % 7;
            for (var k = 1; k <= fillCount; k++) {
                var m2 = calMonth + 2 > 12 ? 1 : calMonth + 2;
                var y2 = calMonth + 2 > 12 ? calYear + 1 : calYear;
                var ds3 = y2 + '-' + String(m2).padStart(2, '0') + '-' + String(k).padStart(2, '0');
                var hasRem3 = reminderDates[ds3] ? ' has-reminder' : '';
                html += '<div class="cal-day other-month' + hasRem3 + '">' + k + '</div>';
            }

            grid.innerHTML = html;
        }

        // ========== 分类渲染 ==========
        function renderCategories() {
            var container = document.getElementById('category-list');
            if (!container) return;
            container.innerHTML = categories.map(function (cat) {
                var count = reminders.filter(function (r) { return r.category === cat.name && !r.done; }).length;
                return '<div class="flex items-center justify-between p-2.5 bg-gray-50 rounded-lg hover:bg-gray-100 transition-colors group">'
                    + '<div class="flex items-center gap-2">'
                    + '<span class="w-3 h-3 rounded ' + catColorBg(cat.color) + '"></span>'
                    + '<span class="text-sm text-gray-700">' + cat.name + '</span>'
                    + '</div>'
                    + '<div class="flex items-center gap-2">'
                    + '<span class="text-[10px] text-gray-400">' + count + '项</span>'
                    + '<button class="del-cat-btn w-6 h-6 rounded flex items-center justify-center text-gray-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all" data-name="' + cat.name + '"><i class="ph ph-trash text-xs"></i></button>'
                    + '</div>'
                    + '</div>';
            }).join('');

            // 更新表单 select
            var select = document.getElementById('form-category');
            if (select) {
                select.innerHTML = categories.map(function (c) {
                    return '<option value="' + c.name + '">' + c.name + '</option>';
                }).join('');
            }
        }

        function catColorBg(color) {
            var map = {
                blue: 'bg-blue-400', purple: 'bg-purple-400', cyan: 'bg-cyan-400',
                amber: 'bg-amber-400', red: 'bg-red-400', green: 'bg-green-400',
                pink: 'bg-pink-400', indigo: 'bg-indigo-400'
            };
            return map[color] || 'bg-gray-400';
        }

        // ========== 模态框：新建/编辑 ==========
        function openModal(id) {
            editingId = id;
            var modal = document.getElementById('reminder-modal');
            var title = document.getElementById('modal-title');
            var formTitle = document.getElementById('form-title');
            var formDesc = document.getElementById('form-desc');
            var formDate = document.getElementById('form-date');
            var formTime = document.getElementById('form-time');
            var formCat = document.getElementById('form-category');
            var formPri = document.getElementById('form-priority');

            if (id) {
                var r = reminders.find(function (x) { return x.id === id; });
                if (!r) return;
                title.textContent = '编辑提醒';
                formTitle.value = r.title;
                formDesc.value = r.desc || '';
                formDate.value = r.date;
                formTime.value = r.time || '09:00';
                formCat.value = r.category;
                formPri.value = r.priority;
                selectedRepeat = r.repeat || 'none';
            } else {
                title.textContent = '新建提醒';
                formTitle.value = '';
                formDesc.value = '';
                formDate.value = todayStr();
                formTime.value = '09:00';
                if (categories.length) formCat.value = categories[0].name;
                formPri.value = 'medium';
                selectedRepeat = 'none';
            }

            // 更新重复按钮状态
            document.querySelectorAll('.repeat-btn').forEach(function (btn) {
                if (btn.dataset.repeat === selectedRepeat) {
                    btn.classList.add('bg-brand-50', 'text-brand-600', 'border-brand-300');
                    btn.classList.remove('text-gray-600');
                } else {
                    btn.classList.remove('bg-brand-50', 'text-brand-600', 'border-brand-300');
                    btn.classList.add('text-gray-600');
                }
            });

            modal.classList.remove('hidden');
        }
        function closeModal() {
            document.getElementById('reminder-modal').classList.add('hidden');
            editingId = null;
        }
        function saveReminder() {
            var title = document.getElementById('form-title').value.trim();
            var date = document.getElementById('form-date').value;
            if (!title) { showToast('请输入提醒标题'); return; }
            if (!date) { showToast('请选择截止日期'); return; }

            var data = {
                title: title,
                desc: document.getElementById('form-desc').value.trim(),
                date: date,
                time: document.getElementById('form-time').value || '09:00',
                category: document.getElementById('form-category').value,
                priority: document.getElementById('form-priority').value,
                repeat: selectedRepeat,
                done: false
            };

            if (editingId) {
                var r = reminders.find(function (x) { return x.id === editingId; });
                if (r) {
                    data.done = r.done;
                    data.id = r.id;
                    var idx = reminders.indexOf(r);
                    reminders[idx] = data;
                }
                showToast('提醒已更新');
            } else {
                data.id = nextId();
                reminders.unshift(data);
                showToast('提醒已创建');
            }

            saveData();
            renderList();
            renderCalendar();
            closeModal();
        }

        // ========== 删除 ==========
        function openDeleteModal(id) {
            deletingId = id;
            var r = reminders.find(function (x) { return x.id === id; });
            var text = document.getElementById('delete-text');
            if (r) text.textContent = '确定要删除「' + r.title + '」吗？删除后无法恢复。';
            document.getElementById('delete-modal').classList.remove('hidden');
        }
        function confirmDelete() {
            if (deletingId) {
                reminders = reminders.filter(function (r) { return r.id !== deletingId; });
                saveData();
                renderList();
                renderCalendar();
                renderCategories();
                showToast('提醒已删除');
            }
            document.getElementById('delete-modal').classList.add('hidden');
            deletingId = null;
        }

        // ========== 完成/取消完成 ==========
        function toggleDone(id) {
            var r = reminders.find(function (x) { return x.id === id; });
            if (r) {
                r.done = !r.done;
                // 如果是重复提醒且完成，生成下一次
                if (r.done && r.repeat !== 'none') {
                    var nextDate = calcNextRepeatDate(r.date, r.repeat);
                    reminders.push({
                        id: nextId(),
                        title: r.title,
                        desc: r.desc,
                        date: nextDate,
                        time: r.time,
                        category: r.category,
                        priority: r.priority,
                        repeat: r.repeat,
                        done: false
                    });
                }
                saveData();
                renderList();
                renderCalendar();
                renderCategories();
                showToast(r.done ? '已完成' : '已恢复');
            }
        }
        function calcNextRepeatDate(dateStr, repeat) {
            var d = new Date(dateStr + 'T00:00:00');
            if (repeat === 'daily') d.setDate(d.getDate() + 1);
            else if (repeat === 'weekly') d.setDate(d.getDate() + 7);
            else if (repeat === 'monthly') d.setMonth(d.getMonth() + 1);
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }

        // ========== 分类管理 ==========
        function openCategoryModal() {
            document.getElementById('cat-form-name').value = '';
            selectedCatColor = { color: 'blue', cls: 'cat-work' };
            updateColorPicker();
            document.getElementById('category-modal').classList.remove('hidden');
        }
        function updateColorPicker() {
            document.querySelectorAll('.cat-color-btn').forEach(function (btn) {
                if (btn.dataset.color === selectedCatColor.color) {
                    btn.classList.add('ring-2', 'ring-offset-2');
                    btn.classList.add(ringColorClass(btn.dataset.color));
                } else {
                    btn.classList.remove('ring-2', 'ring-offset-2');
                    btn.classList.remove(ringColorClass(btn.dataset.color));
                }
            });
        }
        function ringColorClass(color) {
            var map = {
                blue: 'ring-blue-400', purple: 'ring-purple-400', cyan: 'ring-cyan-400',
                amber: 'ring-amber-400', red: 'ring-red-400', green: 'ring-green-400',
                pink: 'ring-pink-400', indigo: 'ring-indigo-400'
            };
            return map[color] || 'ring-gray-400';
        }
        function saveCategory() {
            var name = document.getElementById('cat-form-name').value.trim();
            if (!name) { showToast('请输入分类名称'); return; }
            if (categories.find(function (c) { return c.name === name; })) {
                showToast('分类已存在'); return;
            }
            categories.push({
                name: name,
                cls: selectedCatColor.cls,
                color: selectedCatColor.color
            });
            saveData();
            renderCategories();
            document.getElementById('category-modal').classList.add('hidden');
            showToast('分类已添加');
        }
        function deleteCategory(name) {
            var count = reminders.filter(function (r) { return r.category === name; }).length;
            if (count > 0) {
                showToast('该分类下有 ' + count + ' 个提醒，无法删除');
                return;
            }
            categories = categories.filter(function (c) { return c.name !== name; });
            saveData();
            renderCategories();
            showToast('分类已删除');
        }

        // ========== 配置开关 ==========
        function toggleConfig(key) {
            config[key] = !config[key];
            saveData();
            var el = document.querySelector('[data-config="' + key + '"]');
            if (el) {
                if (config[key]) {
                    el.classList.add('on');
                    el.classList.remove('off');
                } else {
                    el.classList.add('off');
                    el.classList.remove('on');
                }
            }
        }
        function applyConfig() {
            Object.keys(config).forEach(function (key) {
                var el = document.querySelector('[data-config="' + key + '"]');
                if (el) {
                    el.classList.toggle('on', !!config[key]);
                    el.classList.toggle('off', !config[key]);
                }
            });
            var adv = document.getElementById('advance-time');
            if (adv) adv.value = String(config.advance_hours || 0);
        }

        // ========== 事件绑定 ==========
        // 安全绑定：元素不存在时跳过，避免 SPA 切换时报错中断脚本
        function on(id, evt, handler) {
            var el = document.getElementById(id);
            if (el) el.addEventListener(evt, handler);
            return el;
        }

        function bindEvents() {
            // 筛选按钮
            document.querySelectorAll('.filter-btn').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    currentFilter = btn.dataset.filter;
                    document.querySelectorAll('.filter-btn').forEach(function (b) { b.classList.remove('active'); });
                    btn.classList.add('active');
                    renderList();
                });
            });

            // 添加按钮
            var addBtn = document.getElementById('add-reminder-btn');
            if (addBtn) addBtn.addEventListener('click', function () { openModal(null); });

            // 模态框
            on('modal-close', 'click', closeModal);
            on('modal-cancel', 'click', closeModal);
            on('modal-save', 'click', saveReminder);
            on('reminder-modal', 'click', function (e) {
                if (e.target === this) closeModal();
            });

            // 重复按钮
            document.querySelectorAll('.repeat-btn').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    selectedRepeat = btn.dataset.repeat;
                    document.querySelectorAll('.repeat-btn').forEach(function (b) {
                        b.classList.remove('bg-brand-50', 'text-brand-600', 'border-brand-300');
                        b.classList.add('text-gray-600');
                    });
                    btn.classList.add('bg-brand-50', 'text-brand-600', 'border-brand-300');
                    btn.classList.remove('text-gray-600');
                });
            });

            // 列表事件委托
            var list = document.getElementById('reminder-list');
            if (list) list.addEventListener('click', function (e) {
                var card = e.target.closest('.reminder-card');
                if (!card) return;
                var id = parseInt(card.dataset.id);

                if (e.target.closest('.toggle-done-btn')) {
                    toggleDone(id);
                } else if (e.target.closest('.edit-btn')) {
                    openModal(id);
                } else if (e.target.closest('.delete-btn')) {
                    openDeleteModal(id);
                }
            });

            // 删除确认
            on('delete-cancel', 'click', function () {
                var dm = document.getElementById('delete-modal');
                if (dm) dm.classList.add('hidden');
                deletingId = null;
            });
            on('delete-confirm', 'click', confirmDelete);
            on('delete-modal', 'click', function (e) {
                if (e.target === this) { this.classList.add('hidden'); deletingId = null; }
            });

            // 日历导航
            on('cal-prev', 'click', function () {
                calMonth--;
                if (calMonth < 0) { calMonth = 11; calYear--; }
                renderCalendar();
            });
            on('cal-next', 'click', function () {
                calMonth++;
                if (calMonth > 11) { calMonth = 0; calYear++; }
                renderCalendar();
            });

            // 日历点击：点击某天筛选当天
            on('cal-grid', 'click', function (e) {
                var cell = e.target.closest('.cal-day');
                if (!cell || cell.classList.contains('other-month')) return;
                var date = cell.dataset.date;
                if (date) {
                    // 切换到 today 筛选，临时改为按日期筛选
                    currentFilter = 'all';
                    document.querySelectorAll('.filter-btn').forEach(function (b) { b.classList.remove('active'); });
                    var allBtn = document.querySelector('.filter-btn[data-filter="all"]');
                    if (allBtn) allBtn.classList.add('active');
                    renderList();
                    // 滚动到对应提醒
                    var cards = document.querySelectorAll('.reminder-card');
                    for (var i = 0; i < cards.length; i++) {
                        var r = reminders.find(function (x) { return x.id === parseInt(cards[i].dataset.id); });
                        if (r && r.date === date) {
                            cards[i].scrollIntoView({ behavior: 'smooth', block: 'center' });
                            cards[i].style.transition = 'background 0.5s ease';
                            cards[i].style.background = 'rgba(59,130,246,0.06)';
                            setTimeout(function (c) { c.style.background = ''; }, 1500, cards[i]);
                            break;
                        }
                    }
                }
            });

            // 分类管理
            on('add-category-btn', 'click', openCategoryModal);
            on('cat-modal-close', 'click', function () {
                var cm = document.getElementById('category-modal');
                if (cm) cm.classList.add('hidden');
            });
            on('cat-modal-cancel', 'click', function () {
                var cm = document.getElementById('category-modal');
                if (cm) cm.classList.add('hidden');
            });
            on('cat-modal-save', 'click', saveCategory);
            on('category-modal', 'click', function (e) {
                if (e.target === this) this.classList.add('hidden');
            });

            // 颜色选择
            document.querySelectorAll('.cat-color-btn').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    selectedCatColor = { color: btn.dataset.color, cls: btn.dataset.cls };
                    updateColorPicker();
                });
            });

            // 分类删除（事件委托）
            var catList = document.getElementById('category-list');
            if (catList) catList.addEventListener('click', function (e) {
                var delBtn = e.target.closest('.del-cat-btn');
                if (delBtn) {
                    deleteCategory(delBtn.dataset.name);
                }
            });

            // 配置开关
            document.querySelectorAll('.toggle-switch[data-config]').forEach(function (el) {
                el.addEventListener('click', function () {
                    toggleConfig(el.dataset.config);
                });
            });

            // 提前提醒时间
            var adv = document.getElementById('advance-time');
            if (adv) {
                adv.addEventListener('change', function () {
                    config.advance_hours = parseInt(adv.value);
                    saveData();
                });
            }
        }

        // ========== 初始化 ==========
        function init() {
            var now = new Date();
            calYear = now.getFullYear();
            calMonth = now.getMonth();

            loadData();
            applyConfig();
            renderCategories();
            renderList();
            renderCalendar();
            bindEvents();
        }

        // SPA 切换时重新初始化（仅当前页面为提醒页时执行，防止监听器累积）
        window.addEventListener('spa:ready', function (e) {
            var page = (e.detail && e.detail.page) || '';
            if (page && page.indexOf('reminder') === -1) return;
            // 仅渲染数据，不重复绑定事件（bindEvents 内部有 __reminderBound 防重）
            renderList();
            renderCalendar();
            renderCategories();
        });

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
